<main class="account-wrapper">
  <div class="account-header">
    <h1>⚙️ Account Settings</h1>
  </div>

  <div class="account-card">
    <!-- Account Details -->
    <div class="section">
      <div class="section-header">
        <h2>👤 Account Details</h2>
      </div>

      <div class="details-grid">
        <div class="info-box" *ngFor="let field of [
          {label: 'Employee Code', value: employee.employeeCode},
          {label: 'Last Name', value: employee.lastName},
          {label: 'First Name', value: employee.firstName},
          {label: 'Middle Name', value: employee.middleName},
          {label: 'Email', value: employee.email},
          {label: 'Contact Number', value: employee.phoneNumber},
          {label: 'Birth Date', value: (employee.birthDate | date:'dd-MM-yyyy')},
          {label: 'Age', value: employee.age},
          {label: 'Gender', value: employee.gender},
          {label: 'Role Position', value: employee.rolePosition},
          {label: 'Address', value: employee.address}
        ]">
          <label>{{ field.label }}</label>
          <p>{{ field.value }}</p>
        </div>
      </div>
    </div>

    <!-- Account Edit Section -->
    <div class="section">
      <div class="section-header with-action">
        <h2>🔒 Account Credentials</h2>
        <button class="btn-edit">✏️ Edit Account</button>
      </div>

      <div class="details-grid credentials">
        <div class="info-box">
          <label>Username</label>
          <p>Sample Username</p>
        </div>

        <div class="info-box">
          <label>Password</label>
          <p>Sample Password</p>
        </div>
      </div>
    </div>
  </div>
</main>
