<div class="modal">

  <!-- SETTLE HEADER -->
  <div class="settle-header">
    <h2>Payment</h2>
    <a>X</a>
  </div>

  <!-- SETTLE COMPUTE -->
  <div class="settle-container">

    <div class="cash">
      <div class="cash-label">
        <p>Cash</p>
      </div>
    </div>

    <div class="price-section">
      <div class="price-row">
        <div class="label">PRICE PHP</div>
        <div class="value">0.0</div>
      </div>
      <div class="payment-row">
        <div class="label">PAYMENT PHP</div>
        <input type="number" placeholder="&#8369; 0.0" class="value">
      </div>
      <div class="vat-discount">
        <div class="label">DISCOUNT</div>
        <select id="discount" class="value">
          <option>Senior Citizen (20%)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SETTLE KEYPAD -->
  <div class="keypad">
    <button class="key-button number">1</button>
    <button class="key-button number">2</button>
    <button class="key-button number">3</button>
    <button class="key-button number">4</button>
    <button class="key-button number">5</button>
    <button class="key-button number">6</button>
    <button class="key-button number">7</button>
    <button class="key-button number">8</button>
    <button class="key-button number">9</button>
    <button class="key-button clear">AC</button>
    <button class="key-button number">0</button>
    <button class="key-button empty">.</button>
  </div>

  <!-- SETTLE FOOTER BUTTONS -->
  <div class="footer">
    <button class="btn change">Change <span>&#8369; 0.0</span></button>
    <button class="btn confirm">Confirm Payment</button>
  </div>
</div>
