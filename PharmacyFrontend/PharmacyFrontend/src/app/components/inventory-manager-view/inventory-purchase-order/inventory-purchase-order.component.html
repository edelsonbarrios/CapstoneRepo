<div class="purchase-order-form">
  <h2>Create Purchase Order</h2>

  <div class="form-row">
    <div class="form-group">
      <label for="poNumber">Purchase Order Number</label>
      <input type="text" id="poNumber" placeholder="Enter PO Number" />
    </div>
    <div class="form-group">
      <label for="deliveryDate">Delivery Date</label>
      <input type="date" id="deliveryDate" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="supplier">Supplier Name</label>
      <select id="supplier">
        <option value="">-- Select Supplier --</option>
        <option value="supplier1">Supplier 1</option>
        <option value="supplier2">Supplier 2</option>
        <option value="supplier3">Supplier 3</option>
      </select>
    </div>
  </div>

  <div class="form-group full-width">
    <label for="notes">Notes</label>
    <textarea id="notes" rows="3" placeholder="Add notes"></textarea>
  </div>

  <h3>Order Items</h3>
  <table class="items-table">
    <thead>
      <tr>
        <th>Product</th>
        <th>Qty</th>
        <th>Unit Cost</th>
        <th>Total</th>
        <th>Batch Number</th>
        <th>Manufacturing Date</th>
        <th>Expiration Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><select><option>--</option></select></td>
        <td><input type="number" /></td>
        <td><input type="number" /></td>
        <td><input type="text" readonly /></td>
        <td><input type="text" /></td>
        <td><input type="date" /></td>
        <td><input type="date" /></td>
        <td><button class="remove-btn">✕</button></td>
      </tr>
    </tbody>
  </table>
  <button class="add-item-btn">+ Add Item</button>

  <div class="footer">
    <div class="total">
      <strong>Total Amount:</strong> <span id="totalAmount">$0.00</span>
    </div>
    <div class="actions">
      <button class="cancel-btn">Cancel</button>
      <button class="create-btn">Create PO</button>
    </div>
  </div>
</div>
