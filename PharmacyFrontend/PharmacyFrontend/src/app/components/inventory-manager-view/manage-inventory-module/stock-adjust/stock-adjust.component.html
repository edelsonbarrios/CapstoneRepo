<div class="modal" *ngIf="!showSuccessAlert">
  <div class="modal-header">
    <h2>Stock Adjustment</h2>
  </div>

  <div class="modal-body">
    <div class="form-grid">

      <div class="form-group">
        <label>Box Quantity Adjustment</label>
        <input type="number" [(ngModel)]="boxQuantityChanged">
      </div>

      <div class="form-group">
        <label>Sheet Quantity Adjustment</label>
        <input type="number" [(ngModel)]="sheetQuantityChanged">
      </div>

      <div class="form-group">
        <label>Piece Quantity Adjustment</label>
        <input type="number" [(ngModel)]="pieceQuantityChanged">
      </div>

      <div class="form-group">
        <label>Movement Type</label>
        <select id="movement-type" [(ngModel)]="movementType">
          <option *ngFor="let mt of movementTypes" [value]="mt">{{mt}}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Reference Number</label>
        <input type="text" [(ngModel)]="refNumber">
      </div>

      <div class="form-group">
        <label>Employee Name</label>
        <p>{{employee.fullName}}</p>
      </div>

    </div>
  </div>

  <div class="note-desc">
    <p>Notes</p>
    <textarea [(ngModel)]="notes"></textarea>
  </div>

  <div class="modal-footer">
    <button class="btn-save" (click)="createNewStockMovement()">Save</button>
    <button class="btn-cancel" (click)="closeStockAdjustmentForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Stock has been Adjust Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
