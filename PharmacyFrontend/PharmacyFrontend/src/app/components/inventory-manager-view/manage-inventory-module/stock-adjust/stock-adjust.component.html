<div class="modal">
  <div class="modal-header">
    <h2>Stock Adjustment</h2>
  </div>

  <div class="modal-body">
    <div class="form-grid">

      <div class="form-group">
        <label>Quantity On Hand</label>
        <p>{{stockAdjust.quantityOnHand}}</p>
      </div>

      <div class="form-group">
        <label>Movement Type</label>
        <select id="movement-type" [(ngModel)]="movementType">
          <option *ngFor="let mt of movementTypes" [value]="mt">{{mt}}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quantity Changed</label>
        <input type="number" [(ngModel)]="quantityChanged">
      </div>

      <div class="form-group">
        <label>Reference Number</label>
        <input type="text" [(ngModel)]="refNumber">
      </div>
      
      <div class="form-group">
        <label>Employee Name</label>
        <p>{{employee.fullName}}</p>
      </div>

    </div>
  </div>

  <div class="note-desc">
    <p>Notes</p>
    <textarea [(ngModel)]="notes"></textarea>
  </div>

  <div class="modal-footer">
    <button class="btn-save" (click)="createNewStockMovement()">Save</button>
    <button class="btn-cancel" (click)="closeStockAdjustmentForm()">Cancel</button>
  </div>
</div>
