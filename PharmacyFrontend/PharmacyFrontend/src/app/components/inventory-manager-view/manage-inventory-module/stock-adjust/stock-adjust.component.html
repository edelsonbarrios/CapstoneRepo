<div class="modal" *ngIf="!showSuccessAlert">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fas fa-sliders-h"></i>
      </div>
      <div class="title">
        <h2>Stock Adjustment</h2>
        <p>Adjust inventory quantities and movement</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <!-- Error Alert -->
    <div class="error-alert" *ngIf="errorMessage">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <fieldset>
      <legend>
        <i class="fas fa-edit"></i>
        Adjustment Details
      </legend>

      <div class="form-grid">

        <!-- Box Quantity Adjustment -->
        <div class="form-group">
          <label for="boxQuantity">
            Box Quantity Adjustment
            <span class="hint">(Use negative numbers to reduce)</span>
          </label>
          <input
            type="number"
            id="boxQuantity"
            [(ngModel)]="boxQuantityChanged"
            placeholder="e.g., -5 or 10"
          />
        </div>

        <!-- Sheet Quantity Adjustment -->
        <div class="form-group">
          <label for="sheetQuantity">
            Sheet Quantity Adjustment
            <span class="hint">(Use negative numbers to reduce)</span>
          </label>
          <input
            type="number"
            id="sheetQuantity"
            [(ngModel)]="sheetQuantityChanged"
            placeholder="e.g., -5 or 10"
          />
        </div>

        <!-- Piece Quantity Adjustment -->
        <div class="form-group">
          <label for="pieceQuantity">
            Piece Quantity Adjustment
            <span class="hint">(Use negative numbers to reduce)</span>
          </label>
          <input
            type="number"
            id="pieceQuantity"
            [(ngModel)]="pieceQuantityChanged"
            placeholder="e.g., -5 or 10"
          />
        </div>

        <!-- Movement Type -->
        <div class="form-group">
          <label for="movementType">
            Movement Type <span class="required">*</span>
          </label>
          <select
            id="movementType"
            [(ngModel)]="movementType"
            [class.error-border]="!movementType && errorMessage"
          >
            <option value="" disabled selected>Select movement type</option>
            <option *ngFor="let mt of movementTypes" [value]="mt">{{ mt }}</option>
          </select>
        </div>

        <!-- Reference Number -->
        <div class="form-group">
          <label for="refNumber">
            Reference Number <span class="required">*</span>
          </label>
          <input
            type="text"
            id="refNumber"
            [(ngModel)]="refNumber"
            placeholder="e.g., ADJ-2025-001"
            [class.error-border]="!refNumber && errorMessage"
          />
        </div>

        <!-- Employee Name -->
        <div class="form-group">
          <label>Employee Name</label>
          <div class="display-value">{{ employee.fullName || 'Loading...' }}</div>
        </div>

      </div>

      <!-- Notes Section -->
      <div class="notes-section">
        <label for="notes">Notes</label>
        <textarea
          id="notes"
          [(ngModel)]="notes"
          placeholder="Add any additional notes here..."
          rows="4"
        ></textarea>
      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button
      class="btn btn-cancel"
      (click)="closeStockAdjustmentForm()"
      [disabled]="isSubmitting"
    >
      <i class="fas fa-times"></i>
      Cancel
    </button>
    <button
      class="btn btn-save"
      (click)="createNewStockMovement()"
      [disabled]="isSubmitting"
    >
      <i class="fas fa-spinner fa-spin" *ngIf="isSubmitting"></i>
      <i class="fas fa-save" *ngIf="!isSubmitting"></i>
      {{ isSubmitting ? 'Saving...' : 'Save Adjustment' }}
    </button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon success">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#10b981" opacity="0.1"/>
        <circle cx="24" cy="24" r="18" fill="#10b981"/>
        <path d="M16 24L21 29L32 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 class="alert-title">Success!</h3>
    <p class="alert-message">Stock has been adjusted successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">Got it</button>
    </div>
  </div>
</div>

<!-- Login Verification Modal (if needed) -->
<div class="modal-overlay" *ngIf="loginVerify">
  <app-login-verification
  *ngIf="loginVerify"
  (failed)="closeVerificationForm($event)"
  (success)="closeVerificationForm($event)"
  ></app-login-verification>
</div>
