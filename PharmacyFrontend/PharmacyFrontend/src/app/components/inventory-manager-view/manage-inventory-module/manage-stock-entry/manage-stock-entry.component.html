<div class="wrapper">

  <div class="container">
    <div class="manage-stock-entry">

      <!-- STOCK ENTRY CONTROLS/HEADER -->
      <div class="entry-control">
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="🔍 Search by Item Code, Brand...">
        <button class="btn-entry">&#43; Stock Entry</button>
      </div>

      <!-- STOCK ENTRY TABLE -->
      <table class="entry-table">
        <thead>
          <tr>
            <th>Item Code</th>
            <th>Product Name</th>
            <th>Stock On Hand</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>RX&ndash;001</td>
            <td>Biogesic</td>
            <td>120</td>
            <td>
              <div class="in-stock">In Stock</div>
            </td>
          </tr>
          <tr>
            <td>RX&ndash;002</td>
            <td>Decolgen</td>
            <td>15</td>
            <td>
              <div class="low-stock">Low Stock</div>
            </td>
          </tr>
          <tr>
            <td>RX&ndash;003</td>
            <td>Neozep</td>
            <td>0</td>
            <td>
              <div class="out-stock">Out of Stock</div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- FOOTER/PAGINATION -->
      <div class="footer">
        <p>Page 1 of 1</p>
        <div class="page-buttons">
          <button>&lt;</button>
          <button>&gt;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="viewEmployee">
  <app-view-employee 
  *ngIf="viewEmployee"
  [employee]="viewEmployee"
  (closeForm)="closeViewEmployeeForm()"
  ></app-view-employee>
</div>
