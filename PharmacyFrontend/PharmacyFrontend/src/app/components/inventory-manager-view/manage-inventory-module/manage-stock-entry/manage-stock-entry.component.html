<div class="wrapper">

  <div class="container">
    <div class="manage-stock-entry">

      <!-- STOCK ENTRY CONTROLS/HEADER -->
      <div class="entry-control">
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="🔍 Search by Item Code, Brand...">
        <button class="btn-entry" (click)="openCreateStockForm()">&#43; Stock Entry</button>
      </div>

      <!-- STOCK ENTRY TABLE -->
      <table class="entry-table">
        <thead>
          <tr>
            <th>Batch No.</th>
            <th>Product Name</th>
            <th>Box Qty</th>
            <th>Sheet Qty</th>
            <th>Piece Qty</th>
            <th>Reorder Level</th>
            <th>Manufacturing Date</th>
            <th>Expiration</th>
            <th>Cost Price</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let i of inventories">
            <td>{{i.batchNumber}}</td>
            <td>{{i.productName}}</td>
            <td></td>
            <td></td>
            <td>{{i.quantityOnHand}}</td>
            <td></td>
            <td></td>
            <td>{{i.expirationDate | date: 'dd-MM-yyyy'}}</td>
            <td>
              <div class="in-stock">In Stock</div>
            </td>
            <td>
              <button class="btn-view" (click)="openViewEntryForm()">View details</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- FOOTER/PAGINATION -->
      <div class="footer">
        <p>Page 1 of 1</p>
        <div class="page-buttons">
          <button>&lt;</button>
          <button>&gt;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="createStock">
  <app-create-stock 
  *ngIf="createStock"
  (closeForm)="closeCreateStockForm()"
  ></app-create-stock >
</div>

<div class="modal-overlay" *ngIf="viewEntry">
  <app-view-entry 
  *ngIf="viewEntry"
  (closeForm)="closeCreateStockForm()"
  ></app-view-entry >
</div>
