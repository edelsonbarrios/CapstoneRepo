<div class="modal">
  <div class="modal-header">
    <h2>Add Stock Entry</h2>
    <p>Fill in the details to add new entry.</p>
  </div>

  <div class="modal-body">
    <div class="form-grid">

      <div class="form-group">
        <label>Product Name</label>
        <select name="" [(ngModel)]="createStock.productName">
          <option value="">Select Product</option>
          <option *ngFor="let p of products" value="{{p.productName}}">{{p.productName}}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Batch Number</label>
        <input type="text" placeholder="Batch Number" [(ngModel)]="createStock.batchNumber">
      </div>

      <div class="form-group">
        <label>Box Quantity</label>
        <input type="number" [(ngModel)]="createStock.boxQuantity">
      </div>
      
      <div class="form-group">
        <label>Sheet Quantity</label>
        <input type="number" [(ngModel)]="createStock.sheetQuantity">
      </div>

      <div class="form-group">
        <label>Piece Quantity</label>
        <input type="number" [(ngModel)]="createStock.pieceQuantity">
      </div>

      <div class="form-group">
        <label>Sheets Per Box</label>
        <input type="number" [(ngModel)]="createStock.sheetsPerBox">
      </div>

      <div class="form-group">
        <label>Piece Per Sheet</label>
        <input type="number" [(ngModel)]="createStock.piecesPerSheet">
      </div>

      <div class="form-group">
        <label>Box Quantity</label>
        <input type="number" [(ngModel)]="createStock.boxQuantity">
      </div>

      <div class="form-group">
        <label>Reorder Level</label>
        <input type="number" [(ngModel)]="createStock.reorderLevel">
      </div>

      <div class="form-group">
        <label>Manufacturing Date</label>
        <input type="date" [(ngModel)]="createStock.manufacturingDate">
      </div>

      <div class="form-group">
        <label>Expiry Date</label>
        <input type="date" [(ngModel)]="createStock.expirationDate">
      </div>

      <div class="form-group">
        <label>Costing Price*</label>
        <input type="number" [(ngModel)]="createStock.costPrice">
      </div>

      <div class="form-group">
        <label>Box Price*</label>
        <input type="number" [(ngModel)]="createStock.boxPrice">
      </div>

      <div class="form-group">
        <label>Sheet Price</label>
        <input type="number" [(ngModel)]="createStock.sheetPrice">
      </div>

      <div class="form-group">
        <label>Piece Price</label>
        <input type="number" [(ngModel)]="createStock.piecePrice">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="status">
          <option>In Stock</option>
          <option>Low on Stock</option>
          <option>Out of stock</option>
        </select>
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button class="btn-save" (click)="createInventory()">Save</button>
    <button class="btn-cancel" (click)="closeCreateInventoryForm()">Cancel</button>
  </div>
</div>
