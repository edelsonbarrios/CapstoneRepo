<div class="modal" *ngIf="!showSuccessAlert">
  <div class="modal-header">
    <h2>Add Stock Entry</h2>
    <p>Fill in the details to add new entry.</p>
  </div>

  <div class="modal-body">
    <div class="form-grid">

      <div class="form-group" [class.error]="productError">
        <label>Product</label>
        <select [(ngModel)]="selectedProduct" (ngModelChange)="onSelectProduct($event)">
          <option *ngFor="let p of products" [ngValue]="p">{{p.productName}}</option>
        </select>
        <p class="error-message" *ngIf="productError">{{ productError }}</p>
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" placeholder="Category Name" [(ngModel)]="selectedProduct.categoryName">
      </div>

      <div class="form-group" [class.error]="batchNumberError">
        <label>Batch Number</label>
        <input type="text" placeholder="Batch Number" [(ngModel)]="createStock.batchNumber">
        <p class="error-message" *ngIf="batchNumberError">{{ batchNumberError }}</p>
      </div>

      <div class="form-group">
        <label>Box Quantity</label> 
        <input type="number" [(ngModel)]="createStock.boxQuantity" min="0">
      </div>

      <div class="form-group" *ngIf="selectedProduct.unitMeasurement == 'Multi-Level'">
        <label>Sheets Per Box</label>
        <input type="number" [(ngModel)]="selectedProduct.sheetsPerBox" min="0">
      </div>

      <div class="form-group" *ngIf="selectedProduct.unitMeasurement == 'Dual-Level'">
        <label>Piece Per Box</label>
        <input type="number" [(ngModel)]="selectedProduct.piecePerBox" min="0">
      </div>

      <div class="form-group" *ngIf="selectedProduct.unitMeasurement == 'Dual-Level'">
        <label>Piece Quantity</label>
        <input type="number" [(ngModel)]="createStock.pieceQuantity" min="0">
      </div>

      <div class="form-group" *ngIf="selectedProduct.unitMeasurement == 'Multi-Level'">
        <label>Piece Per Sheet</label>
        <input type="number" [(ngModel)]="selectedProduct.piecesPerSheet" min="0">
      </div>

      <div class="form-group">
        <label>Reorder Level</label>
        <input type="number" [(ngModel)]="selectedProduct.reorderLevel" min="0">
      </div>

      <div class="form-group" [class.error]="manufacturingDateError">
        <label>Manufacturing Date</label>
        <input type="date" [(ngModel)]="createStock.manufacturingDate">
        <p class="error-message" *ngIf="manufacturingDateError">{{ manufacturingDateError }}</p>
      </div>

      <div class="form-group" [class.error]="expirationDateError">
        <label>Expiry Date</label>
        <input type="date" [(ngModel)]="createStock.expirationDate">
        <p class="error-message" *ngIf="expirationDateError">{{ expirationDateError }}</p>
      </div>

      <div class="form-group" [class.error]="costPriceError">
        <label>Cost Price*</label>
        <input type="number" [(ngModel)]="createStock.costPrice" min="0">
        <p class="error-message" *ngIf="costPriceError">{{ costPriceError }}</p>
      </div>

      <div class="form-group">
        <label>Box Price*</label>
        <input type="number" [(ngModel)]="selectedProduct.boxPrice" min="0">
      </div>

      <div class="form-group" *ngIf="selectedProduct.unitMeasurement == 'Multi-Level'">
        <label>Sheet Price</label>
        <input type="number" [(ngModel)]="selectedProduct.sheetPrice" min="0">
      </div>

      <div class="form-group">
        <label>Piece Price</label>
        <input type="number" [(ngModel)]="selectedProduct.piecePrice" min="0">
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button class="btn-save" (click)="createInventory()">Save</button>
    <button class="btn-cancel" (click)="closeCreateInventoryForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Stock Entry has been Added Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
