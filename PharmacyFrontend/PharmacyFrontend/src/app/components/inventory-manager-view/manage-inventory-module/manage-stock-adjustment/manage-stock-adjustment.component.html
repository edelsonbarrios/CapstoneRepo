<div class="wrapper">

  <div class="container">
    <div class="manage-stock-adjustment">

      <!-- STOCK ADJUSTMENT CONTROLS/HEADER -->
      <div class="adjust-control">
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="🔍 Search by Item Code, Brand...">
      </div>

      <!-- STOCK ADJUSTMENT TABLE -->
      <table class="adjust-table">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Stock On Hand</th>
            <th>Manufacturing Date</th>
            <th>Expiration Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let i of inventories">
            <td>{{i.productName}}</td>
            <td>{{i.manufacturingDate | date: 'dd-MM-yyy'}}</td>
            <td>{{i.expirationDate | date : 'dd-MM-yyyy'}}</td>
            <td>
              <div class="in-stock">In Stock</div>
            </td>
            <td>
              <button class="btn-adjust" (click)="openStockAdjustmentForm(i)">Adjust</button>
              <button class="btn-archive">Archive</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- FOOTER/PAGINATION -->
      <div class="footer">
        <p>Page 1 of 1</p>
        <div class="page-buttons">
          <button>&lt;</button>
          <button>&gt;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="stockAdjust">
  <app-stock-adjust 
  *ngIf="stockAdjust"
  [stockAdjust]="stockAdjust"
  (closeForm)="closeStockAdjustmentForm()"
  ></app-stock-adjust>
</div>
