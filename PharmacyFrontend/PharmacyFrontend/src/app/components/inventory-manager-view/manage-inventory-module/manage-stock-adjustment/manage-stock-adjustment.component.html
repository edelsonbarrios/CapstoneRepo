<div class="wrapper">

  <div class="container">
    <div class="manage-stock-adjustment">

      <!-- STOCK ADJUSTMENT CONTROLS/HEADER -->
      <div class="adjust-control">
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="🔍 Search by Item Code, Brand...">
      </div>

      <!-- STOCK ADJUSTMENT TABLE -->
      <table class="adjust-table">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Movement Type</th>
            <th>Ref. Number</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sm of paginatedStockMovements">
            <td>{{sm.productName}}</td>
            <td>{{sm.movementType}}</td>
            <td>{{sm.referenceNumber}}</td>
            <td>
              <div class="in-stock">In Stock</div>
            </td>
            <td>
              <button class="btn-adjust" (click)="openStockAdjustmentForm(sm)">Adjust</button>
              <button class="btn-archive">Archive</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- PAGINATION CONTROLS -->
      <div class="pagination-controls">
        <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
        <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
        <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="stockAdjust">
  <app-stock-adjust 
  *ngIf="stockAdjust"
  [stockAdjust]="stockAdjust"
  (closeForm)="closeStockAdjustmentForm()"
  ></app-stock-adjust>
</div>
