<div class="modal">

  <a (click)="closeViewAdjustmentForm()">&lt; Back</a>

  <!-- MODAL HEADER -->
  <div class="modal-header">

    <div class="header-grid">
      <div class="batch">
        <p>Batch Number</p>
        <h2>{{viewAdjust.batchNumber}}</h2>
      </div>

      <div class="movement">
        <p>Movement Type</p>
        <h2>{{viewAdjust.movementType}}</h2>
      </div>

      <div class="date">
        <p>Date & Time</p>
        <h2>{{viewAdjust.movementDate | date: 'dd-MM-yyyy'}}</h2>
      </div>
    </div>

  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">

    <div class="product-info">
      <p>Product Name</p>
      <input type="text" [(ngModel)]="viewAdjust.productName">
    </div>

    <p>Boxes</p>

    <div class="grid-container">
      <div class="grid-items">
        <p>Before</p>
        <input type="number" [(ngModel)]="viewAdjust.boxQuantityBefore">
      </div>

      <div class="grid-items">
        <p>Changed</p>
        <input type="number" class="change" [(ngModel)]="viewAdjust.boxQuantityChanged">
      </div>

      <div class="grid-items">
        <p>After</p>
        <input type="number" class="after" [(ngModel)]="viewAdjust.boxQuantityAfter">
      </div>
    </div>

    <p>Sheets</p>

    <div class="grid-container">
      <div class="grid-items">
        <p>Before</p>
        <input type="number" [(ngModel)]="viewAdjust.sheetQuantityBefore">
      </div>

      <div class="grid-items">
        <p>Changed</p>
        <input type="number" class="change" [(ngModel)]="viewAdjust.sheetQuantityChanged">
      </div>

      <div class="grid-items">
        <p>After</p>
        <input type="number" class="after" [(ngModel)]="viewAdjust.sheetQuantityAfter">
      </div>
    </div>

    <p>Pieces</p>

    <div class="grid-container">
      <div class="grid-items">
        <p>Before</p>
        <input type="number" [(ngModel)]="viewAdjust.pieceQuantityBefore">
      </div>

      <div class="grid-items">
        <p>Changed</p>
        <input type="number" class="change" [(ngModel)]="viewAdjust.pieceQuantityChanged">
      </div>

      <div class="grid-items">
        <p>After</p>
        <input type="number" class="after" [(ngModel)]="viewAdjust.pieceQuantityAfter">
      </div>
    </div>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">

    <div class="reference-num">
      <p>Reference Number</p>
      <input type="text" [(ngModel)]="viewAdjust.referenceNumber">
    </div>
    
    <div class="notes">
      <p>Notes</p>
      <textarea>
        
      </textarea>
    </div>

  </div>
</div>
