<div class="wrapper">
  <div class="top-bar">
    <input
      type="text"
      class="search-box"
      placeholder="🔍 Search by Item Code, Brand..."
    />
  </div>

  <div class="card">
    <table class="modern-table">
      <thead>
        <tr>
          <th>PO Number</th>
          <th>Supplier</th>
          <th>Order Date</th>
          <th>Delivery Date</th>
          <th>Status</th>
          <th class="center">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let po of paginatedPurchaseOrders">
          <td>{{ po.purchaseOrderNumber }}</td>
          <td>{{ po.supplierName }}</td>
          <td>{{ po.orderDate | date: 'dd-MM-yyyy' }}</td>
          <td>{{ po.deliveryDate | date: 'dd-MM-yyyy' }}</td>
          <td>{{ po.status }}</td>
          <td class="center">
            <button class="btn primary" (click)="viewPurchaseOrderDetails(po)">
              View PO
            </button>
            <button class="btn danger" (click)="openArchivePurchaseOrderForm(po.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination">
      <button
        class="page-btn"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >
        ◀ Previous
      </button>
      <span class="page-info">Page {{ currentPage }} of {{ totalPages }}</span>
      <button
        class="page-btn"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)"
      >
        Next ▶
      </button>
    </div>
  </div>
</div>

<!-- VIEW PURCHASE ORDER MODAL -->
<div class="modal-overlay" *ngIf="purchaseOrder">
  <app-view-purchase-order-details
    *ngIf="purchaseOrder"
    [purchaseOrder]="purchaseOrder"
    (closeForm)="closeViewPurchaseOrderForm()"
  ></app-view-purchase-order-details>
</div>

<!-- ARCHIVE CONFIRMATION MODAL -->
<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
    *ngIf="showArchiveForm"
    [alertMessage]="'Purchase Order successfully deleted.'"
    [id]="showArchiveForm"
    [message]="'Are you sure you want to delete this Purchase Order?'"
    (onArchive)="archivePurchaseOrder()"
    (onCancel)="closeArchivePurchaseOrderForm()"
  ></app-archive-confirmation>
</div>
