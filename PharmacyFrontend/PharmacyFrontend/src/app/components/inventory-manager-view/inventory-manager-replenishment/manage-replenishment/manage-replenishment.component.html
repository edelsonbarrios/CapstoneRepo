<div class="wrapper">
  <div class="manage-replenishment">
    <!-- SEARCH BAR -->
    <div class="top-bar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-box" placeholder="Search by Item Code, Brand..." />
      </div>
    </div>

    <!-- PURCHASE ORDER TABLE -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>PO Number</th>
          <th>Supplier</th>
          <th>Order Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="paginatedPurchaseOrders.length === 0">
          <td colspan="6" style="text-align: center; color: #94a3b8; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let po of paginatedPurchaseOrders">
          <td>{{ po.purchaseOrderNumber }}</td>
          <td>{{ po.supplierName }}</td>
          <td>{{ po.orderDate | date: 'yyyy-MM-dd' }}</td>
          <td>{{ po.status }}</td>
          <td>
            <button class="btn-view" (click)="viewPurchaseOrderDetails(po)">
              View PO
            </button>
            <button class="btn-archive" (click)="openArchivePurchaseOrderForm(po.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="paginatedPurchaseOrders.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
        Previous
      </button>
      <span class="page-info">Page {{ currentPage }} of {{ totalPages }}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
        Next
      </button>
    </div>
  </div>
</div>

<!-- VIEW PURCHASE ORDER MODAL -->
<div class="modal-overlay" *ngIf="purchaseOrder">
  <app-view-purchase-order-details *ngIf="purchaseOrder" [purchaseOrder]="purchaseOrder"
    (closeForm)="closeViewPurchaseOrderForm()"></app-view-purchase-order-details>
</div>

<!-- ARCHIVE CONFIRMATION MODAL -->
<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation *ngIf="showArchiveForm" [alertMessage]="'Purchase Order successfully deleted.'"
    [id]="showArchiveForm" [message]="'Are you sure you want to delete this Purchase Order?'"
    (onArchive)="archivePurchaseOrder()" (onCancel)="closeArchivePurchaseOrderForm()"></app-archive-confirmation>
</div>
