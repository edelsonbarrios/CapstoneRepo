<div class="wrapper">
  <div class="manage-product">

    <!-- PRODUCT CONTROLS/HEADER -->
    <div class="product-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-product" (click)="openCreateProductForm()">&#43; Add Product</button>
    </div>

    <!-- PRODUCT TABLE -->
    <table class="product-table">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Category</th>
          <th>Brand</th>
          <th>Generic</th>
          <th>Type</th>
          <th>Supplier</th>
          <th>Classification</th>
          <th>Formulation</th>  
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of products">
          <td>{{p.productName}}</td>
          <td>{{p.categoryName}}</td>
          <td>{{p.brandName}}</td>
          <td>{{p.genericName}}</td>
          <td>{{p.typeName}}</td>
          <td>{{p.supplierName}}</td>
          <td>{{p.classificationName}}</td>
          <td>{{p.formulationName}}</td>
          <td>{{p.price}}</td>
          <td>
            <button class="btn-view" (click)="openViewProductForm()">See Detais</button>
            <button class="btn-update">Update</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- FOOTER/PAGINATION -->
    <div class="footer">
      <p>Page 1 of 1</p>
      <div class="page-buttons">
        <button>&lt;</button>
        <button>&gt;</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="newProduct">
  <app-create-product 
  *ngIf="newProduct"
  (closeForm)="closeCreateProductForm()"
  ></app-create-product>
</div>

<div class="modal-overlay" *ngIf="viewProduct">
  <app-view-product *ngIf="viewProduct"></app-view-product>
</div>
