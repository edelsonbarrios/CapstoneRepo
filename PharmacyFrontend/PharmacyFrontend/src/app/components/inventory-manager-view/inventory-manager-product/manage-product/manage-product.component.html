<div class="wrapper">
  <div class="manage-product">

    <!-- PRODUCT CONTROLS/HEADER -->
    <div class="product-control">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="Search by Item Code, Brand..."
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
          >
      </div>
      <button class="btn-product" (click)="openCreateProductForm()">&#43; Add Product</button>
    </div>

    <!-- PRODUCT TABLE -->
    <table class="product-table">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Category</th>
          <th>Brand</th>
          <th>Box Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="products.length === 0">
          <td colspan="5" style="text-align: center; color: #94a3b8; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let p of paginatedProducts">
          <td>{{p.productName}}</td>
          <td>{{p.categoryName}}</td>
          <td *ngIf="p.brandName">{{p.brandName}}</td>
          <td *ngIf="p.brandName == ''">N/A</td>
          <td>{{p.boxPrice}}</td>
          <td>
            <button class="btn-view" (click)="openViewProductForm(p)">See Details</button>
            <button class="btn-update" (click)="openUpdateProductForm(p)">Update</button>
            <button class="btn-archive" (click)="openArchiveProductForm(p.productID)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="products.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="newProduct">
  <app-create-product 
  *ngIf="newProduct"
  (closeForm)="closeCreateProductForm()"
  ></app-create-product>
</div>

<div class="modal-overlay" *ngIf="viewProduct">
  <app-view-product 
  *ngIf="viewProduct"
  [viewProduct]="viewProduct"
  (closeForm)="closeViewProductForm()"
  ></app-view-product>
</div>

<div class="modal-overlay" *ngIf="updateProduct">
  <app-update-product 
  [productToUpdate]="updateProduct"
  *ngIf="updateProduct"
  (closeForm)="closeUpdateProductForm()"
  ></app-update-product>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">Product has been Archived Successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
  *ngIf="showArchiveForm"
  [alertMessage]="'Product has been deleted.'"
  [id]="showArchiveForm"
  [message]="message"

  (onArchive)="archiveProduct(showArchiveForm)"
  (onCancel)="closeArchiveProductForm()"
  ></app-archive-confirmation>
</div>
