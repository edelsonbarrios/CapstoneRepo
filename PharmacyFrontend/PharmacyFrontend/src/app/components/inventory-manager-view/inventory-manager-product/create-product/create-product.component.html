<div class="modal" *ngIf="!showSuccessAlert">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="modal-title">
      <h2>Add Product</h2>
      <a>&#10006;</a>
    </div>
    <div class="desc">Fill in the details to register a new product.</div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">

    <div class="form-grid">

      <!-- Product Name (Text Input) -->
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" [(ngModel)]="newProduct.productName">
      </div>

      <div class="form-group">
        <label>Category Name</label>
        <select [(ngModel)]="newProduct.categoryName">
          <option value="">-- Select Category --</option>
          <option *ngFor="let c of categories" [value]="c.categoryName">{{c.categoryName}}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Unit of Measurement</label>
        <select [(ngModel)]="newProduct.unitMeasurement" (ngModelChange)="selectUnitOfMeasurement($event)">
          <option value="Multi-Level">Multi Level</option>
          <option value="Dual-Level">Dual Level</option>
        </select>
      </div>

      <!-- Brand Name -->
      <div class="form-group" *ngIf="newProduct.categoryName === 'Medicine'">
        <label>Brand Name</label>
        <select [(ngModel)]="newProduct.brandName">
          <option value="">-- Select Brand --</option>
          <option *ngFor="let b of brands" [value]="b.brandName">{{b.brandName}}</option>
        </select>
      </div>

      <!-- Generic Name -->
      <div class="form-group" *ngIf="newProduct.categoryName === 'Medicine'">
        <label>Generic Name</label>
        <select [(ngModel)]="newProduct.genericName">
          <option value="">-- Select Generic --</option>
          <option *ngFor="let g of generics" [value]="g.genericName">{{g.genericName}}</option>
        </select>
      </div>

      <!-- Classification -->
      <div class="form-group" *ngIf="newProduct.categoryName === 'Medicine'">
        <label>Classification</label>
        <select [(ngModel)]="newProduct.classificationName">
          <option value="">-- Select Classification --</option>
          <option *ngFor="let c of classifications" [value]="c.classificationName">{{c.classificationName}}</option>
        </select>
      </div>

      <!-- Type -->
      <div class="form-group" *ngIf="newProduct.categoryName === 'Medicine'">
        <label>Type</label>
        <select [(ngModel)]="newProduct.typeName">
          <option value="">-- Select Type --</option>
          <option *ngFor="let t of types" [value]="t.typeName">{{t.typeName}}</option>
        </select>
      </div>

      <!-- Formulation -->
      <div class="form-group" *ngIf="newProduct.categoryName === 'Medicine'">
        <label>Formulation</label>
        <select [(ngModel)]="newProduct.formulationName">
          <option value="">-- Select Formulation --</option>
          <option *ngFor="let f of formulations" [value]="f.formulationName">{{f.formulationName}}</option>
        </select>
      </div>

      

      <div class="form-group" *ngIf="unitMeasurement == 'Multi-Level'">
        <label *ngIf="unitMeasurement == 'Multi-Level'">Sheets Per Box</label>
        <input *ngIf="unitMeasurement == 'Multi-Level'" type="number" [(ngModel)]="newProduct.sheetsPerBox">
        
      </div>

      <div class="form-group" *ngIf="unitMeasurement == 'Dual-Level'">
        <label *ngIf="unitMeasurement == 'Dual-Level'">Piece Per Box</label>
        <input *ngIf="unitMeasurement == 'Dual-Level'" type="number" [(ngModel)]="newProduct.piecePerBox">
      </div>

      <div class="form-group" *ngIf="unitMeasurement == 'Multi-Level'">
        <label *ngIf="unitMeasurement == 'Multi-Level'">Pieces Per Sheet</label>
        <input *ngIf="unitMeasurement == 'Multi-Level'" type="number" [(ngModel)]="newProduct.piecesPerSheet">
      </div>

      <div class="form-group">
        <label>Box Price (&#8369;)</label>
        <input type="number" [(ngModel)]="newProduct.boxPrice">
      </div>

      <div class="form-group" *ngIf="unitMeasurement == 'Multi-Level'">
        <label *ngIf="unitMeasurement == 'Multi-Level'">Sheet Price (&#8369;)</label>
        <input *ngIf="unitMeasurement == 'Multi-Level'" type="number" [(ngModel)]="newProduct.sheetPrice">
      </div>

      <div class="form-group">
        <label>Piece Price (&#8369;)</label>
        <input type="number" [(ngModel)]="newProduct.piecePrice">
      </div>

      <div class="form-group">
        <label>Reorder Level</label>
        <input type="number" [(ngModel)]="newProduct.reorderLevel">
      </div>

    </div>

  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="createProduct()">Save</button>
    <button class="btn-cancel" (click)="closeCreateProductForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Product has been Added Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
