<div class="modal">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="modal-title">
      <h2>Add Product</h2>
      <a>&#10006;</a>
    </div>
    <div class="desc">Fill in the details to register a new product.</div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">

   <div class="form-grid">
     <div class="form-group">
      <label>Item Code</label>
      <input type="text">
    </div>

    <div class="form-group">
      <label>Brand Name</label>
      <input type="text">
    </div>
    
    <div class="form-group">
      <label>Generic Name</label>
      <input type="text">
    </div>

    <div class="form-group">
      <label>Classification</label>
      <input type="text">
    </div>
    
    <div class="form-group">
      <label>Type</label>
      <input type="text">
    </div>

    <div class="form-group">
      <label>Formulation</label>
      <input type="text">
    </div>
    
    <div class="form-group">
      <label>Unit Price (&#8369;)</label>
      <input type="number">
    </div>

    <div class="form-group">
      <label>Re-order Level</label>
      <input type="number">
    </div>

    <div class="form-group">
      <label>Stock on Hand</label>
      <input type="number">
    </div>

    <div class="form-group">
      <label>Expiry (dd/mm/yyyy)</label>
      <input type="date">
    </div>

   </div>

  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn-save">Save</button>
    <button class="btn-cancel">Cancel</button>
  </div>
</div>
