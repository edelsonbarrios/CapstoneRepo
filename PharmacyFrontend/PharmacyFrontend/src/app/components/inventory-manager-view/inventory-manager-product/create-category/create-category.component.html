<div class="modal" *ngIf="!showSuccessAlert">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <div class="title">
        <h2>Add New Category</h2>
        <p>Fill in the details to register a new category</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <div class="form-group" [class.error]="categoryNameError">
      <label for="categoryName">
        Category Name
        <span class="required">*</span>
      </label>
      <input
        type="text"
        id="categoryName"
        placeholder="Enter Category Name"
        [(ngModel)]="newCategory.categoryName"
      />
      <span class="error-message" *ngIf="categoryNameError">
        <i class="fas fa-exclamation-circle"></i>
        {{ categoryNameError }}
      </span>
    </div>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeCreateCategoryForm()">
      Cancel
    </button>
    <button class="btn btn-save" (click)="createCategory()">
      <i class="fas fa-save"></i>
      Save Category
    </button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon success">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#10b981" opacity="0.1"/>
        <circle cx="24" cy="24" r="18" fill="#10b981"/>
        <path d="M16 24L21 29L32 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 class="alert-title">Success!</h3>
    <p class="alert-message">Category has been added successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">Got it</button>
    </div>
  </div>
</div>
