<div class="modal">

  <!-- VIEW PRODUCT HEADER -->
  <div class="modal-header">
    <div class="modal-title">
      <h2>BIOGESIC&ndash;RX&ndash;001</h2>
      <a>&#10006;</a>
    </div>
    <div class="desc">Full product information.</div>
  </div>

  <!-- VIEW PRODUCT BODY -->
  <div class="modal-body">

    <div class="form-grid">
      <div class="form-group">
        <label>Generic Name</label>
        <p>{{viewProduct.genericName}}</p>
      </div>

      <div class="form-group">
        <label>Classification</label>
        <p>{{viewProduct.classificationName}}</p>
      </div>

      <div class="form-group">
        <label>Type</label>
        <p>{{viewProduct.typeName}}</p>
      </div>

      <div class="form-group">
        <label>Formulation</label>
        <p>{{viewProduct.formulationName}}</p>
      </div>

      <div class="form-group">
        <label>Price (&#8369;)</label>
        <p>{{viewProduct.boxPrice}}</p>
      </div>

      <div class="form-group">
        <label>Category</label>
        <p>{{viewProduct.categoryName}}</p>
      </div>

    </div>

  </div>

  <!-- VIEW PRODUCT FOOTER -->
  <div class="modal-footer">
    <button class="btn-update">Update</button>
    <button class="btn-cancel" (click)="closeViewProductForm()">Cancel</button>
  </div>
</div>
