<div class="modal">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="modal-title">
      <h2>Update Category</h2>
      <a>&#10006;</a>
    </div>
    <div class="desc">Modify the category details.</div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">

   <div class="form">
     <div class="form-group">
      <label>Category Name</label>
      <input type="text" [(ngModel)]="viewCategory.categoryName">
    </div>

   </div>

  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn-update" (click)="updateCategory()">Update</button>
    <button class="btn-cancel" (click)="closeUpdateCategoryForm()">Cancel</button>
  </div>
</div>

<div class="success-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">Category Successfully updated.</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>
