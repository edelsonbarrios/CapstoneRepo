<div class="modal" *ngIf="!showSuccessAlert">
  
  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fas fa-edit"></i>
      </div>
      <div class="title">
        <h2>{{ productToUpdate.productName || 'Update Product' }}</h2>
        <p>Modify product information below</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <fieldset>
      <legend>
        <i class="fas fa-clipboard-list"></i>
        Product Details
      </legend>

      <div class="form-grid">

        <!-- Product Name -->
        <div class="form-group">
          <label for="productName">
            Product Name
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="productName"
            [(ngModel)]="productToUpdate.productName"
            placeholder="Enter product name"
          />
        </div>

        <!-- Generic Name -->
        <div class="form-group" *ngIf="shouldShowField('genericName')">
          <label for="genericName">Generic Name</label>
          <select id="genericName" [(ngModel)]="productToUpdate.genericName">
            <option value="">Select Generic</option>
            <option *ngFor="let g of generics" [value]="g.genericName">{{g.genericName}}</option>
          </select>
        </div>

        <!-- Brand Name -->
        <div class="form-group" *ngIf="shouldShowField('brandName')">
          <label for="brandName">Brand Name</label>
          <select id="brandName" [(ngModel)]="productToUpdate.brandName">
            <option value="">Select Brand</option>
            <option *ngFor="let b of brands" [value]="b.brandName">{{b.brandName}}</option>
          </select>
        </div>

        <!-- Classification -->
        <div class="form-group" *ngIf="shouldShowField('classificationName')">
          <label for="classificationName">Classification</label>
          <select id="classificationName" [(ngModel)]="productToUpdate.classificationName">
            <option value="">Select Classification</option>
            <option *ngFor="let c of classifications" [value]="c.classificationName">{{c.classificationName}}</option>
          </select>
        </div>

        <!-- Type -->
        <div class="form-group" *ngIf="shouldShowField('typeName')">
          <label for="typeName">Type</label>
          <select id="typeName" [(ngModel)]="productToUpdate.typeName">
            <option value="">Select Type</option>
            <option *ngFor="let t of types" [value]="t.typeName">{{t.typeName}}</option>
          </select>
        </div>

        <!-- Formulation -->
        <div class="form-group" *ngIf="shouldShowField('formulationName')">
          <label for="formulationName">Formulation</label>
          <select id="formulationName" [(ngModel)]="productToUpdate.formulationName">
            <option value="">Select Formulation</option>
            <option *ngFor="let f of formulations" [value]="f.formulationName">{{f.formulationName}}</option>
          </select>
        </div>

        <!-- Category -->
        <div class="form-group" *ngIf="shouldShowField('categoryName')">
          <label for="categoryName">Category</label>
          <select id="categoryName" [(ngModel)]="productToUpdate.categoryName">
            <option value="">Select Category</option>
            <option *ngFor="let c of categories" [value]="c.categoryName">{{c.categoryName}}</option>
          </select>
        </div>

        <!-- Sheets Per Box -->
        <div class="form-group" *ngIf="shouldShowField('sheetsPerBox')">
          <label for="sheetsPerBox">Sheets Per Box</label>
          <input
            type="number"
            id="sheetsPerBox"
            [(ngModel)]="productToUpdate.sheetsPerBox"
            placeholder="Enter sheets per box"
            min="0"
          />
        </div>

        <!-- Pieces Per Sheet -->
        <div class="form-group" *ngIf="shouldShowField('piecesPerSheet')">
          <label for="piecesPerSheet">Pieces Per Sheet</label>
          <input
            type="number"
            id="piecesPerSheet"
            [(ngModel)]="productToUpdate.piecesPerSheet"
            placeholder="Enter pieces per sheet"
            min="0"
          />
        </div>

        <!-- Pieces Per Box -->
        <div class="form-group" *ngIf="shouldShowField('piecePerBox')">
          <label for="piecePerBox">Pieces Per Box</label>
          <input
            type="number"
            id="piecePerBox"
            [(ngModel)]="productToUpdate.piecePerBox"
            placeholder="Enter pieces per box"
            min="0"
          />
        </div>

        <!-- Box Price -->
        <div class="form-group" *ngIf="shouldShowField('boxPrice')">
          <label for="boxPrice">Box Price (&#8369;)</label>
          <input
            type="number"
            id="boxPrice"
            [(ngModel)]="productToUpdate.boxPrice"
            placeholder="Enter box price"
            min="0"
            step="0.01"
          />
        </div>

        <!-- Sheet Price -->
        <div class="form-group" *ngIf="shouldShowField('sheetPrice')">
          <label for="sheetPrice">Sheet Price (&#8369;)</label>
          <input
            type="number"
            id="sheetPrice"
            [(ngModel)]="productToUpdate.sheetPrice"
            placeholder="Enter sheet price"
            min="0"
            step="0.01"
          />
        </div>

        <!-- Piece Price -->
        <div class="form-group" *ngIf="shouldShowField('piecePrice')">
          <label for="piecePrice">Piece Price (&#8369;)</label>
          <input
            type="number"
            id="piecePrice"
            [(ngModel)]="productToUpdate.piecePrice"
            placeholder="Enter piece price"
            min="0"
            step="0.01"
          />
        </div>

        <!-- Reorder Level -->
        <div class="form-group" *ngIf="shouldShowField('reorderLevel')">
          <label for="reorderLevel">Reorder Level</label>
          <input
            type="number"
            id="reorderLevel"
            [(ngModel)]="productToUpdate.reorderLevel"
            placeholder="Enter reorder level"
            min="0"
          />
        </div>

      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeUpdateProductForm()">
      Cancel
    </button>
    <button class="btn btn-update" (click)="updateProduct()">
      <i class="fas fa-save"></i>
      Update Product
    </button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon success">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#10b981" opacity="0.1"/>
        <circle cx="24" cy="24" r="18" fill="#10b981"/>
        <path d="M16 24L21 29L32 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 class="alert-title">Success!</h3>
    <p class="alert-message">Product has been updated successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">Got it</button>
    </div>
  </div>
</div>
