<div class="wrapper">
  <div class="manage-category">

    <!-- CATEGORY CONTROLS/HEADER -->
    <div class="category-control">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          name="searchbar"
          id="searchbar"
          class="searchbar"
          placeholder="Search by Item Code, Brand..."
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
        />
      </div>
      <button class="btn-category" (click)="openCreateCategoryForm()">&#43; Add Category</button>
    </div>

    <!-- CATEGORY TABLE -->
    <table class="category-table">
      <thead>
        <tr>
          <th>Category Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="categories.length === 0">
          <td colspan="2" style="text-align: center; color: #94a3b8; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let c of paginatedCategories">
          <td>{{ c.categoryName }}</td>
          <td>
            <button class="btn-update" (click)="openViewCategoryForm(c)">Update</button>
            <button class="btn-archive" (click)="openArchiveForm(c.categoryID)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="categories.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{ currentPage }} of {{ totalPages }}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<!-- CREATE CATEGORY MODAL -->
<div class="modal-overlay" *ngIf="newCategory">
  <app-create-category
    *ngIf="newCategory"
    (closeForm)="closeCreateCategoryForm()"
  ></app-create-category>
</div>

<!-- UPDATE/VIEW CATEGORY MODAL -->
<div class="modal-overlay" *ngIf="categoryToUpdate">
  <app-view-category
    *ngIf="categoryToUpdate"
    [viewCategory]="categoryToUpdate"
    (closeForm)="closeUpdateCategoryForm()"
  ></app-view-category>
</div>

<!-- SUCCESS ALERT -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">Category has been Archived Successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>

<!-- ARCHIVE CONFIRMATION -->
<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
    *ngIf="showArchiveForm"
    [id]="showArchiveForm"
    [alertMessage]="'Category successfully deleted.'"
    [message]="'Do you really want to delete this category?'"
    (onArchive)="archiveCategory()"
    (onCancel)="closeArchiveForm()"
  ></app-archive-confirmation>
</div>
