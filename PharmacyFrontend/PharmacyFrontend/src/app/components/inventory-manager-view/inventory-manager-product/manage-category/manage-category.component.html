<div class="wrapper">
  <div class="manage-category">

    <!-- CATEGORY CONTROLS/HEADER -->
    <div class="category-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-category" (click)="openCreateCategoryForm()">&#43; Add Category</button>
    </div>

    <!-- CATEGORY TABLE -->
    <table class="category-table">
      <thead>
        <tr>
          <th>Category Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of paginatedCategories">
          <td>{{c.categoryName}}</td>
          <td>
            <button class="btn-update" (click)="openViewCategoryForm()">Update</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="newCategory">
  <app-create-category 
  *ngIf="newCategory"
  (closeForm)="closeCreateCategoryForm()"
  ></app-create-category>
</div>

<div class="modal-overlay" *ngIf="viewCategory">
  <app-view-category *ngIf="viewCategory"></app-view-category>
</div>
