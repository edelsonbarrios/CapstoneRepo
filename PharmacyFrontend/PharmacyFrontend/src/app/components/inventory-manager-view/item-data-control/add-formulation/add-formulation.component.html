<div class="modal">

  <!-- ADD FORMULATION HEADER -->
  <div class="modal-header">
    <h2>Add Formulation</h2>
    <a>X</a>
  </div>

  <!-- ADD FORMULATION FILL UP -->
  <div class="fillup">
    <label>Item Code</label>
    <input type="text" placeholder="(e.g.BIOG500T..)">

    <label>Formulation</label>
    <input type="text" placeholder="(e.g.Biogesic 500mg Tablet..)">

    <label>Ingredient</label>
    <input type="text" placeholder="(e.g.Paracetamol...)">
  </div>

  <div class="last-fillup">
    <div class="amount">
      <label>Amount</label>
      <input type="number" placeholder="(e.g.500...)">
    </div>

    <div class="unit">
      <label>Unit</label>
      <select id="weight">
        <option>mg</option>
      </select>
    </div>
  </div>

  <!-- ADD FORMULATION FOOTER -->
  <div class="modal-footer">
    <button class="btn-save">Save</button>
    <button class="btn-cancel">Cancel</button>
  </div>
</div>
