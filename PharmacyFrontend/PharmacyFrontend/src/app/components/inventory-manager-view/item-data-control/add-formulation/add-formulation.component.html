<div class="modal" *ngIf="!showSuccessAlert">

  <!-- ADD FORMULATION HEADER -->
  <div class="modal-header">
    <h2>Add Formulation</h2>
    <a>X</a>
  </div>

  <!-- ADD FORMULATION FILL UP -->
  <div class="fillup" [class.error]="formulationNameError">
    <label>Formulation Name</label>
    <input type="text" placeholder="(e.g.Biogesic 500mg Tablet..)" [(ngModel)]="addFormulation.formulationName">
    <p class="error-message" *ngIf="formulationNameError">{{ formulationNameError }}</p>
  </div>

  <!-- ADD FORMULATION FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="createNewFormulation()">Save</button>
    <button class="btn-cancel" (click)="closeAddFormulationForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Formulation has been Added Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
