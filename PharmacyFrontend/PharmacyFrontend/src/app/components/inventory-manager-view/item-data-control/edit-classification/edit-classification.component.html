<div class="modal" *ngIf="!showSuccessAlert">

    <!-- EDIT CLASSIFICATION HEADER -->
    <div class="modal-header">
        <h2>Edit Classification</h2>
        <a>X</a>
    </div>

    <!-- EDIT CLASSIFICATION FILL UP -->
    <div class="fillup" [class.error]="classificationNameError">
        <label>Classification</label>
        <input type="text" placeholder="(eg., Pain Reliever...)" [(ngModel)]="editClassification.classificationName">
        <p class="error-message" *ngIf="classificationNameError">{{ classificationNameError }}</p>
    </div>

    <!-- EDIT CLASSIFICATION FOOTER -->
    <div class="modal-footer">
        <button class="btn-save" (click)="updateClassification()">Update</button>
        <button class="btn-cancel" (click)="closeEditClassificationForm()">Cancel</button>
    </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Item has been Updated</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
