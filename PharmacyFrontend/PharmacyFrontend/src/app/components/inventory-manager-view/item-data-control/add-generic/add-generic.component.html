<div class="modal" *ngIf="!showSuccessAlert">

  <!-- ADD GENERIC HEADER -->
  <div class="modal-header">
    <h2>Add Generic Name</h2>
    <a>X</a>
  </div>

  <!-- ADD GENERIC FILL UP -->
  <div class="fillup" [class.error]="genericNameError">
    <label>Generic Name</label>
    <input type="text" placeholder="(e.g. Paracetamol)" [(ngModel)]="addGeneric.genericName">
    <p class="error-message" *ngIf="genericNameError">{{ genericNameError }}</p>
  </div>

  <!-- ADD GENERIC FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="createNewGeneric()">Save</button>
    <button class="btn-cancel" (click)="closeAddGenericForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Generic has been Added Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
