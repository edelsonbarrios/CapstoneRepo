<div class="modal">

    <!-- EDIT GENERIC HEADER -->
    <div class="modal-header">
        <h2>Edit Generic Name</h2>
        <a>X</a>
    </div>

    <!-- EDIT GENERIC FILL UP -->
    <div class="fillup">
        <label>Generic Name</label>
        <input type="text" placeholder="(e.g. Paracetamol)" [(ngModel)]="editGeneric.genericName">
    </div>

    <!-- EDIT GENERIC FOOTER -->
    <div class="modal-footer">
        <button class="btn-save" (click)="updateGeneric()">Update</button>
        <button class="btn-cancel" (click)="closeEditGenericForm()">Cancel</button>
    </div>
</div>
