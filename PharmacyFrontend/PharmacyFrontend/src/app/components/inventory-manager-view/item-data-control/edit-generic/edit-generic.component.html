<div class="modal" *ngIf="!showSuccessAlert">

    <!-- EDIT GENERIC HEADER -->
    <div class="modal-header">
        <h2>Edit Generic Name</h2>
        <a>X</a>
    </div>

    <!-- EDIT GENERIC FILL UP -->
    <div class="fillup" [class.error]="genericNameError">
        <label>Generic Name</label>
        <input type="text" placeholder="(e.g. Paracetamol)" [(ngModel)]="editGeneric.genericName">
        <p class="error-message" *ngIf="genericNameError">{{ genericNameError }}</p>
    </div>

    <!-- EDIT GENERIC FOOTER -->
    <div class="modal-footer">
        <button class="btn-save" (click)="updateGeneric()">Update</button>
        <button class="btn-cancel" (click)="closeEditGenericForm()">Cancel</button>
    </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Item has been Updated</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
