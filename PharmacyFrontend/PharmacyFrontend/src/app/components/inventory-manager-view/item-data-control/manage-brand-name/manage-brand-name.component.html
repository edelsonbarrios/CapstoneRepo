<div class="wrapper">
  <div class="manage-brand-name">

    <!-- BRAND NAME CONTROLS/HEADER -->
    <div class="brand-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-brand" (click)="openAddBrandForm()">&#43; Add Brand</button>
    </div>

    <!-- BRAND NAME TABLE -->
    <table class="brand-table">
      <thead>
        <tr>
          <th>Brand</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of brands">
          <td>{{b.brandName}}</td>
          <td>
            <button class="btn-edit" (click)="openEditBrandForm(b)">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- FOOTER/PAGINATION -->
    <div class="footer">
      <p>Page 1 of 1</p>
      <div class="page-buttons">
        <button>&lt;</button>
        <button>&gt;</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addBrand">
  <app-add-brand 
  *ngIf="addBrand"
  (closeForm)="closeAddBrandForm()"
  ></app-add-brand>
</div>

<div class="modal-overlay" *ngIf="editBrand">
  <app-edit-brand 
  *ngIf="editBrand"
  [editBrand]="editBrand"
  (closeForm)="closeEditBrandForm()"
  ></app-edit-brand>
</div>
