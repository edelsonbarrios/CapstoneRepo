<div class="wrapper">
  <div class="manage-brand-name">

    <!-- BRAND NAME CONTROLS/HEADER -->
    <div class="brand-control">
      <div class="search-wrapper">
        <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="Search by Item Code, Brand... "[(ngModel)]="searchQuery" (input)="onSearchChange()">
      </div>
      <button class="btn-brand" (click)="openAddBrandForm()">&#43; Add Brand</button>
    </div>

    <!-- BRAND NAME TABLE -->
    <table class="brand-table">
      <thead>
        <tr>
          <th>Brand</th>
          <th style="text-align: center">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="brands.length === 0">
          <td colspan="2" style="text-align: center; color: #94a3b8; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let b of paginatedBrands">
          <td>{{b.brandName}}</td>
          <td style="text-align: center">
            <button class="btn-edit" (click)="openEditBrandForm(b)">Edit</button>
            <button class="btn-archive" (click)="openArchiveForm(b.brandID)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="brands.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addBrand">
  <app-add-brand *ngIf="addBrand" (closeForm)="closeAddBrandForm()"></app-add-brand>
</div>

<div class="modal-overlay" *ngIf="editBrand">
  <app-edit-brand *ngIf="editBrand" [editBrand]="editBrand" (closeForm)="closeEditBrandForm()"></app-edit-brand>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation *ngIf="showArchiveForm" [id]="showArchiveForm"
    [alertMessage]="'Brand successfully archived.'" [message]="'Do you really want to archive this brand?'"
    (onArchive)="archiveBrand()" (onCancel)="closeArchiveForm()"></app-archive-confirmation>
</div>
