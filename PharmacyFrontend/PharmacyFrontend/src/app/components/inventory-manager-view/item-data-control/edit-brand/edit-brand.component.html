<!-- edit-brand.component.html -->
<div class="modal" *ngIf="!showSuccessAlert">
  
  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fa-solid fa-file-prescription"></i>
      </div>
      <div class="title">
        <h2>Edit Brand Name</h2>
        <p>Update brand information</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <fieldset>
      <legend>
        <i class="fas fa-clipboard-list"></i>
        Brand Details
      </legend>

      <div class="form-grid">
        <!-- Brand Name -->
        <div class="form-group" [class.error]="brandNameError">
          <label for="brandName">
            Brand Name
            <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="brandName"
            placeholder="(e.g. Biogesic)" 
            [(ngModel)]="editBrand.brandName"
          />
          <span class="error-message" *ngIf="brandNameError">
            <i class="fas fa-exclamation-circle"></i>
            {{ brandNameError }}
          </span>
        </div>
      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeEditBrandForm()">
      Cancel
    </button>
    <button class="btn btn-save" (click)="updateBrand()">
      <i class="fas fa-save"></i>
      Update Brand
    </button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon success">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#10b981" opacity="0.1"/>
        <circle cx="24" cy="24" r="18" fill="#10b981"/>
        <path d="M16 24L21 29L32 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 class="alert-title">Success!</h3>
    <p class="alert-message">Item has been Updated</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">Got it</button>
    </div>
  </div>
</div>
