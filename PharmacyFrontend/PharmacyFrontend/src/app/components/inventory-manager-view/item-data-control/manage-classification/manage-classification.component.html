<div class="wrapper">
  <div class="manage-classification">

    <!-- CLASSIFICATION CONTROLS/HEADER -->
    <div class="class-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-class" (click)="openAddClassificationForm()">&#43; Add Clasification</button>
    </div>

    <!-- CLASSIFICATION TABLE -->
    <table class="classification-table">
      <thead>
        <tr>
          <th>Classification</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of paginatedClassifications">
          <td>{{c.classificationName}}</td>
          <td style="text-align: center;">
            <button class="btn-edit" (click)="openEditClassificationForm(c)">Edit</button>
            <button class="btn-archive" (click)="goToPage(1)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addClassification">
  <app-add-classification 
  *ngIf="addClassification"
  (closeForm)="closeAddClassificationForm()"
  ></app-add-classification>
</div>

<div class="modal-overlay" *ngIf="editClassification">
  <app-edit-classification 
  *ngIf="editClassification"
  [editClassification]="editClassification"
  (closeForm)="closeEditClassificationForm()"
  ></app-edit-classification>
</div>
