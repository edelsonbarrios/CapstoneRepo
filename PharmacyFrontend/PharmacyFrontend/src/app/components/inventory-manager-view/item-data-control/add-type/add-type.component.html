<div class="modal" *ngIf="!showSuccessAlert">

  <!-- ADD TYPE HEADER -->
  <div class="modal-header">
    <h2>Add Type Name</h2>
    <a>X</a>
  </div>

  <!-- ADD TYPE FILL UP -->
  <div class="fillup" [class.error]="typeNameError">
    <label>Type</label>
    <input type="text" placeholder="(e.,g Tablet...)" [(ngModel)]="addType.typeName">
    <p class="error-message" *ngIf="typeNameError">{{ typeNameError }}</p>
  </div>

  <!-- ADD TYPE FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="createNewType()">Save</button>
    <button class="btn-cancel" (click)="closeAddTypeForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Type has been Added Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
