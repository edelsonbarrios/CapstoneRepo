<div class="modal">

  <!-- EDIT TYPE HEADER -->
  <div class="modal-header">
    <h2>Add Brand Name</h2>
    <a>X</a>
  </div>

  <!-- EDIT TYPE FILL UP -->
  <div class="fillup">
    <label>Type</label>
    <input type="text" placeholder="(e.,g Tablet...)" [(ngModel)]="editType.typeName">
  </div>

  <!-- EDIT TYPE FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="updateType()">Update</button>
    <button class="btn-cancel" (click)="closeEditTypeForm()">Cancel</button>
  </div>
</div>
