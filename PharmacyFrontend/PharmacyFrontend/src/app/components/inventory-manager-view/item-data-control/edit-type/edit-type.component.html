<div class="modal" *ngIf="!showSuccessAlert">

  <!-- EDIT TYPE HEADER -->
  <div class="modal-header">
    <h2>Add Brand Name</h2>
    <a>X</a>
  </div>

  <!-- EDIT TYPE FILL UP -->
  <div class="fillup" [class.error]="typeNameError">
    <label>Type</label>
    <input type="text" placeholder="(e.,g Tablet...)" [(ngModel)]="editType.typeName">
    <p class="error-message" *ngIf="typeNameError">{{ typeNameError }}</p>
  </div>

  <!-- EDIT TYPE FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="updateType()">Update</button>
    <button class="btn-cancel" (click)="closeEditTypeForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Item has been Updated</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
