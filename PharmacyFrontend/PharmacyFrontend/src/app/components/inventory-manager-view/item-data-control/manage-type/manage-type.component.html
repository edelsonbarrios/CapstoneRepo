<div class="wrapper">
  <div class="manage-type">

    <!-- TYPE CONTROLS/HEADER -->
    <div class="type-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-type" (click)="openAddTypeForm()">&#43; Add Type</button>
    </div>

    <!-- TYPE TABLE -->
    <table class="type-table">
      <thead>
        <tr>
          <th>Item Code</th>
          <th>Type</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>TYPE001</td>
          <td>Tablet</td>
          <td>
            <button class="btn-edit" (click)="openEditTypeForm()">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
        <tr>
          <td>TYPE002</td>
          <td>Syrup</td>
          <td>
            <button class="btn-edit">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
        <tr>
          <td>TYPE003</td>
          <td>Capsule</td>
          <td>
            <button class="btn-edit">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
         <tr>
          <td>TYPE004</td>
          <td>Injection Drugs</td>
          <td>
            <button class="btn-edit">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- FOOTER/PAGINATION -->
    <div class="footer">
      <p>Page 1 of 1</p>
      <div class="page-buttons">
        <button>&lt;</button>
        <button>&gt;</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addType">
  <app-add-type *ngIf="addType"></app-add-type>
</div>

<div class="modal-overlay" *ngIf="editType">
  <app-edit-type *ngIf="editType"></app-edit-type>
</div>
