<div class="wrapper">
  <div class="manage-type">

    <!-- TYPE CONTROLS/HEADER -->
    <div class="type-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-type" (click)="openAddTypeForm()">&#43; Add Type</button>
    </div>

    <!-- TYPE TABLE -->
    <table class="type-table">
      <thead>
        <tr>
          <th>Type</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of types">
          <td>{{t.typeName}}</td>
          <td style="text-align: center;">
            <button class="btn-edit" (click)="openEditTypeForm(t)">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- FOOTER/PAGINATION -->
    <div class="footer">
      <p>Page 1 of 1</p>
      <div class="page-buttons">
        <button>&lt;</button>
        <button>&gt;</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addType">
  <app-add-type 
  *ngIf="addType"
  (closeForm)="closeAddTypeForm()"
  ></app-add-type>
</div>

<div class="modal-overlay" *ngIf="editType">
  <app-edit-type 
  *ngIf="editType"
  [editType]="editType"
  (closeForm)="closeEditTypeForm()"
  ></app-edit-type>
</div>
