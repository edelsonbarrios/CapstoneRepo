<div class="wrapper">
  <div class="manage-type">

    <!-- TYPE CONTROLS/HEADER -->
    <div class="type-control">
      <div class="search-wrapper">
        <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="Search by Item Code, Brand..." [(ngModel)]="searchQuery" (input)="onSearchChange()">
      </div>
      <button class="btn-type" (click)="openAddTypeForm()">&#43; Add Type</button>
    </div>

    <!-- TYPE TABLE -->
    <table class="type-table">
      <thead>
        <tr>
          <th>Type</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="types.length === 0">
          <td colspan="2" style="text-align: center; color: #94a3b8; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let t of paginatedTypes">
          <td>{{t.typeName}}</td>
          <td style="text-align: center;">
            <button class="btn-edit" (click)="openEditTypeForm(t)">Edit</button>
            <button class="btn-archive" (click)="openArchiveConfirmationForm(t.typeID)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="types.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addType">
  <app-add-type *ngIf="addType" (closeForm)="closeAddTypeForm()"></app-add-type>
</div>

<div class="modal-overlay" *ngIf="editType">
  <app-edit-type *ngIf="editType" [editType]="editType" (closeForm)="closeEditTypeForm()"></app-edit-type>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation *ngIf="showArchiveForm" [id]="showArchiveForm"
    [message]="'Do you really want to archive this type?'" [alertMessage]="'Type successfully archived.'"
    (onArchive)="archiveType()" (onCancel)="closeArchiveConfirmationForm()"></app-archive-confirmation>

</div>
