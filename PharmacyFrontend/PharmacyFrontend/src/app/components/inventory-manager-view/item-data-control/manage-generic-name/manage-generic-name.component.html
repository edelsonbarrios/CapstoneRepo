<div class="wrapper">
  <div class="manage-generic-name">

    <!-- GENERIC NAME CONTROLS/HEADER -->
    <div class="generic-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand..."
        [(ngModel)]="searchQuery"
        (input)="onSearchChange()">
      <button class="btn-generic" (click)="openAddGenericForm()">&#43; Add Generic</button>
    </div>

    <!-- GENERIC NAME TABLE -->
    <table class="generic-table">
      <thead>
        <tr>
          <th>Generic Name</th>
          <th style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="generics.length === 0">
          <td colspan="2" style="text-align: center; color: #525252; padding: 1rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let g of paginatedGenerics">
          <td>{{g.genericName}}</td>
          <td style="text-align: center;">
            <button class="btn-edit" (click)="openEditGenericForm(g)">Edit</button>
            <button class="btn-archive" (click)="openArchiveConfirmationForm(g.genericID)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addGeneric">
  <app-add-generic 
  *ngIf="addGeneric"
  (closeForm)="closeAddGenericForm()"
  ></app-add-generic>
</div>

<div class="modal-overlay" *ngIf="editGeneric">
  <app-edit-generic 
  *ngIf="editGeneric"
  [editGeneric]="editGeneric"
  (closeForm)="closeEditGenericForm()"
  ></app-edit-generic>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
  *ngIf="showArchiveForm"
  [id]="showArchiveForm"
  [alertMessage]="'Generic successfully deleted.'"
  [message]="'Do you really want to delete this generic?'"
  
  (onArchive)="archiveGeneric()"
  (onCancel)="closeArchiveConfirmationForm()"
  ></app-archive-confirmation>
</div>
