<div class="wrapper">
  <div class="manage-generic-name">

    <!-- GENERIC NAME CONTROLS/HEADER -->
    <div class="generic-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-generic" (click)="openAddGenericForm()">&#43; Add Generic</button>
    </div>

    <!-- GENERIC NAME TABLE -->
    <table class="generic-table">
      <thead>
        <tr>
          <th>Generic Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let g of generics">
          <td>{{g.genericName}}</td>
          <td>
            <button class="btn-edit" (click)="openEditGenericForm(g)">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- FOOTER/PAGINATION -->
    <div class="footer">
      <p>Page 1 of 1</p>
      <div class="page-buttons">
        <button>&lt;</button>
        <button>&gt;</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addGeneric">
  <app-add-generic 
  *ngIf="addGeneric"
  (closeForm)="closeAddGenericForm()"
  ></app-add-generic>
</div>

<div class="modal-overlay" *ngIf="editGeneric">
  <app-edit-generic 
  *ngIf="editGeneric"
  [editGeneric]="editGeneric"
  (closeForm)="closeEditGenericForm()"
  ></app-edit-generic>
</div>
