<div class="modal">

  <!-- EDIT FORMULATION HEADER -->
  <div class="modal-header">
    <h2>Add Formulation</h2>
    <a>X</a>
  </div>

  <!-- EDIT FORMULATION FILL UP -->
  <div class="fillup" [class.error]="formulationNameError">
    <label>Formulation</label>
    <input type="text" placeholder="(e.g.Biogesic 500mg Tablet..)" [(ngModel)]="editFormulation.formulationName">
    <p class="error-message" *ngIf="formulationNameError">{{ formulationNameError }}</p>
  </div>

  <!-- EDIT FORMULATION FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="updateFormulation()">Update</button>
    <button class="btn-cancel" (click)="closeEditFormulationForm()">Cancel</button>
  </div>
</div>
