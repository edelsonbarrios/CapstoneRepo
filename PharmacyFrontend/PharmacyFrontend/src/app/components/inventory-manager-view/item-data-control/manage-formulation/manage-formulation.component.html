<div class="wrapper">
  <div class="manage-formulation">

    <!-- FORMULATION CONTROLS/HEADER -->
    <div class="formulation-control">
      <input type="text" name="searchbar" id="searchbar" class="searchbar"
        placeholder="🔍 Search by Item Code, Brand...">
      <button class="btn-formulation" (click)="openAddFormulationForm()">&#43; Add Formulation</button>
    </div>

    <!-- FORMULATION TABLE -->
    <table class="formulation-table">
      <thead>
        <tr>
          <th>Formulation</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of formulations">
          <td>{{f.formulationName}}</td>
          <td style="text-align: center;">
            <button class="btn-edit" (click)="openEditFormulationForm(f)">Edit</button>
            <button class="btn-archive">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- FOOTER/PAGINATION -->
    <div class="footer">
      <p>Page 1 of 1</p>
      <div class="page-buttons">
        <button>&lt;</button>
        <button>&gt;</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addFormulation">
  <app-add-formulation 
  *ngIf="addFormulation"
  (closeForm)="closeAddFormulationForm()"
  ></app-add-formulation>
</div>

<div class="modal-overlay" *ngIf="editFormulation">
  <app-edit-formulation 
  *ngIf="editFormulation"
  [editFormulation]="editFormulation"
  (closeForm)="closeEditFormulationForm()"
  ></app-edit-formulation>
</div>
