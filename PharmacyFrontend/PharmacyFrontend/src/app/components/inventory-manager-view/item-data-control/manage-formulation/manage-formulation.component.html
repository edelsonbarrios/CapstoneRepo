<div class="wrapper">
  <div class="manage-formulation">

    <!-- FORMULATION CONTROLS/HEADER -->
    <div class="formulation-control">
      <div class="search-wrapper">
        <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" name="searchbar" id="searchbar" class="searchbar"
          placeholder="Search by Item Code, Brand..." [(ngModel)]="searchQuery" (input)="onSearchChange()">
      </div>
      <button class="btn-formulation" (click)="openAddFormulationForm()">&#43; Add Formulation</button>
    </div>

    <!-- FORMULATION TABLE -->
    <table class="formulation-table">
      <thead>
        <tr>
          <th>Formulation</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="formulations.length === 0">
          <td colspan="2" style="text-align: center; color: #94a3b8; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let f of paginatedFormulations">
          <td>{{f.formulationName}}</td>
          <td style="text-align: center;">
            <button class="btn-edit" (click)="openEditFormulationForm(f)">Edit</button>
            <button class="btn-archive" (click)="openArchiveForm(f.formulationID)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="formulations.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="addFormulation">
  <app-add-formulation *ngIf="addFormulation" (closeForm)="closeAddFormulationForm()"></app-add-formulation>
</div>

<div class="modal-overlay" *ngIf="editFormulation">
  <app-edit-formulation *ngIf="editFormulation" [editFormulation]="editFormulation"
    (closeForm)="closeEditFormulationForm()"></app-edit-formulation>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation *ngIf="showArchiveForm" [id]="showArchiveForm"
    [alertMessage]="'Formulation sucessfully deleted.'" [message]="'Do you really want to delete this formulation?'"
    (onArchive)="archiveFormulation()" (onCancel)="closeArchiveForm()"></app-archive-confirmation>
</div>
