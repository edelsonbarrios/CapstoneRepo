<div class="modal" *ngIf="!showSuccessAlert">

  <!-- ADD BRAND HEADER -->
  <div class="modal-header">
    <h2>Add Brand Name</h2>
    <a>X</a>
  </div>

  <!-- ADD BRAND FILL UP -->
  <div class="fillup" [class.error]="brandNameError">
    <label>Brand Name</label>
    <input type="text" placeholder="(e.g. Biogesic)" [(ngModel)]="addBrand.brandName">
    <p class="error-message" *ngIf="brandNameError">{{ brandNameError }}</p>
  </div>

  <!-- ADD BRAND FOOTER -->
  <div class="modal-footer">
    <button class="btn-save" (click)="createNewBrand()">Save</button>
    <button class="btn-cancel" (click)="closeCreateBrandForm()">Cancel</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Brand has been Added Successfully</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
