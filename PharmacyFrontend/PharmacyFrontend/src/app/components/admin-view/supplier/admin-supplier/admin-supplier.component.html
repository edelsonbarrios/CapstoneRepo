<div class="wrapper">
  <div class="search-container container">
    <div class="search-controls">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          class="search-box" 
          placeholder="Search Supplier..." 
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
        >
      </div>
      <button class="btn-new-supplier" (click)="openCreateSupplierForm()">+ New Supplier</button>
    </div>
  </div>

  <div class="table-container container">
    <h2>Supplier Management</h2>
    
    <table class="modern-table">
      <thead>
        <tr>
          <th>Supplier Name</th>
          <th>Contact Person</th>
          <th>Contact #1</th>
          <th>Contact #2</th>
          <th>Email</th>
          <th>Address</th>
          <th>Status</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="suppliers.length === 0">
          <td colspan="8" style="text-align: center;">No suppliers found</td>
        </tr>
        <tr *ngFor="let s of paginatedSuppliers">
          <td>{{s.supplierName}}</td>
          <td>{{s.contactPerson}}</td>
          <td>{{s.contactNumber}}</td>
          <td>{{s.contactPersonNumber}}</td>
          <td>{{s.email}}</td>
          <td>{{s.address}}</td>
          <td>
            <span class="status-badge">Active</span>
          </td>
          <td style="text-align: center;">
            <div class="action-btns">
              <button class="btn-action btn-assign" (click)="openAssignProductSupplierForm(s)">Assign Product</button>
              <button class="btn-action btn-view" (click)="openViewSupplierForm(s)">View</button>
              <button class="btn-action btn-delete" (click)="openArchiveForm(s.id)">Archive</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="suppliers.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="newSupplier">
  <app-create-supplier
    *ngIf="newSupplier"
    [newSupplier]="newSupplier"
    (closeForm)="closeCreateSupplierForm()"
  ></app-create-supplier>
</div>

<div class="modal-overlay" *ngIf="assignSupplier">
  <app-assign-products-supplier 
    *ngIf="assignSupplier"
    (close)="closeAssignProductSupplierForm()"
    [supplier]="assignSupplier"
  ></app-assign-products-supplier>
</div>

<div class="modal-overlay" *ngIf="viewSupplier">
  <app-view-supplier
    *ngIf="viewSupplier"
    [viewSupplier]="viewSupplier"
    (closeForm)="closeViewSupplierForm()"
  ></app-view-supplier>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
    *ngIf="showArchiveForm"
    [id]="showArchiveForm"
    [alertMessage]="'Supplier successfully archived.'"
    [message]="'Do you really want to archive this supplier?'"
    (onArchive)="archiveSupplier()"
    (onCancel)="closeArchiveForm()"
  ></app-archive-confirmation>
</div>
