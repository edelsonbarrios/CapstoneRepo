<div class="wrapper">
  <div class="top-bar">
    <input type="text" class="search-box" placeholder="🔍 Search Supplier...">
    <button class="btn new-supplier" (click)="openCreateSupplierForm()">+ New Supplier</button>
  </div>

  <div class="card">
    <table class="modern-table">
      <thead>
        <tr>
          <th>Supplier Name</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Address</th>
          <th>Status</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of suppliers">
          <td>{{s.supplierName}}</td>
          <td>{{s.contactNumber}}</td>
          <td>{{s.email}}</td>
          <td>{{s.address}}</td>
          <td>
            <span class="status active">Active</span>
          </td>
          <td>
            <div class="action-btns">
              <button class="btn add">+ Assign Product</button>
              <button class="btn edit">Edit</button>
              <button class="btn archive">Archive</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination">
      <button>&lt;</button>
      <span>Page 1 of 1</span>
      <button>&gt;</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="newSupplier">
  <app-create-supplier
  *ngIf="newSupplier"
  ></app-create-supplier>
</div>
