<div class="wrapper">
  <div class="top-bar">
    <input type="text" class="search-box" placeholder="🔍 Search Supplier...">
    <button class="btn new-supplier" (click)="openCreateSupplierForm()">+ New Supplier</button>
  </div>

  <div class="card">
    <table class="modern-table">
      <thead>
        <tr>
          <th>Supplier Name</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Address</th>
          <th>Status</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of paginatedSuppliers">
          <td>{{s.supplierName}}</td>
          <td>{{s.contactNumber}}</td>
          <td>{{s.email}}</td>
          <td>{{s.address}}</td>
          <td>
            <span class="status active">Active</span>
          </td>
          <td>
            <div class="action-btns">
              <button class="btn add">+ Assign Product</button>
              <button class="btn edit">Edit</button>
              <button class="btn archive" (click)="archiveSupplier(s)">Archive</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="newSupplier">
  <app-create-supplier
  *ngIf="newSupplier"
  [newSupplier]="newSupplier"
  (closeForm)="closeCreateSupplierForm()"
  ></app-create-supplier>
</div>
