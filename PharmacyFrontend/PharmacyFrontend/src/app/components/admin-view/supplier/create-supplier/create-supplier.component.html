<div class="modal">
  <div class="modal-header">
    <div class="icon-title">
      <span class="icon">👤</span>
      <div class="title">
        <h2>Add Supplier</h2>
        <p>Fill in supplier contact details below.</p>
      </div>
    </div>
  </div>

  <div class="modal-body">
    <form>
      <div class="form-grid">
        <div class="form-group">
          <label for="supplierName">Supplier Name <span class="required">*</span></label>
          <input type="text" id="supplierName" placeholder="e.g., Dyna Drug">
        </div>

        <div class="form-group">
          <label for="contactNumber">Contact Number <span class="required">*</span></label>
          <input type="text" id="contactNumber" placeholder="e.g., 09xx xxx xxxx">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="examplesupplier@gmail.com">
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="City, Province">
        </div>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button class="btn cancel">Cancel</button>
    <button class="btn save">Save</button>
  </div>
</div>
