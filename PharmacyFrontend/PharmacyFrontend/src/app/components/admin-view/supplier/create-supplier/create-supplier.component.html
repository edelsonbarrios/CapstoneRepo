<div class="modal">
  <div class="modal-header">
    <div class="icon-title">
      <span class="icon">👤</span>
      <div class="title">
        <h2>Add Supplier</h2>
        <p>Fill in supplier contact details below.</p>
      </div>
    </div>
  </div>

  <div class="modal-body">

    <div class="form-grid">
      <div class="form-group">
        <label for="supplierName">Supplier Name <span class="required">*</span></label>
        <input type="text" id="supplierName" placeholder="e.g., Dyna Drug" [(ngModel)]="newSupplier.supplierName">
      </div>

      <div class="form-group">
        <label for="contactNumber">Contact Number <span class="required">*</span></label>
        <input type="text" id="contactNumber" placeholder="e.g., 09xx xxx xxxx" [(ngModel)]="newSupplier.contactNumber">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="examplesupplier@gmail.com" [(ngModel)]="newSupplier.email">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" placeholder="City, Province" [(ngModel)]="newSupplier.address">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn cancel" (click)="closeCreateSupplierForm()">Cancel</button>
    <button class="btn save" (click)="createNewSupplier()">Save</button>
  </div>
</div>
