<div class="wrapper">
  <div class="card">
    <!-- Search & Add Employee -->
    <div class="table-header">
      <div class="search-wrapper">
        <input type="text" placeholder="🔍 Search Last Name" class="search-box" [(ngModel)]="this.lastNameSearch"/>
        <button class="btn search-btn" (click)="getEmployeesByLastName()">Search</button>
      </div>
      <button class="btn add" (click)="openCreateEmployeeForm()">+ Add Employee</button>
    </div>

    <!-- Employee Table -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>Employee Code</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role Position</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of employees">
          <td>{{ e.employeeCode }}</td>
          <td>{{ e.fullName }}</td>
          <td>{{ e.email }}</td>
          <td>{{ e.rolePosition }}</td>
          <td style="text-align: center;">
            <button class="btn details" (click)="openViewEmployeeForm(e)">See Details</button>
            <button class="btn details" id="red" (click)="archiveEmployee(e)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="viewEmployee">
  <app-view-employee 
  *ngIf="viewEmployee"
  [employee]="viewEmployee"
  (closeForm)="closeViewEmployeeForm()"
  ></app-view-employee>
</div>

<div class="modal-overlay" *ngIf="newEmployee">
  <app-create-employee
  *ngIf="newEmployee"
  [newEmployee]="newEmployee"
  (closeForm)="closeCreateEmployeeForm()"
  ></app-create-employee>
</div>
