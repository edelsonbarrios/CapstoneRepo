<div class="wrapper">
  <div class="card">
    <!-- Search & Add Employee -->
    <div class="table-header">
      <div class="search-wrapper">
        <input type="text" placeholder="Search Last Name" class="search-box" 
         [(ngModel)]="this.searchQuery"
         (input)="onSearchChange()"
          />
        <button class="btn search-btn" (click)="getEmployeesByLastName()"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <button class="btn add" (click)="openCreateEmployeeForm()">+ Add Employee</button>
    </div>

    <!-- Employee Table -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>Employee Code</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role Position</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="employees.length === 0">
          <td colspan="5" style="text-align: center; color: #888; padding: 2rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let e of paginatedEmployees">
          <td>{{ e.employeeCode }}</td>
          <td>{{ e.fullName }}</td>
          <td>{{ e.email }}</td>
          <td>{{ e.rolePosition }}</td>
          <td style="text-align: center;">
            <button class="btn details" (click)="openViewEmployeeForm(e)">See Details</button>
            <button class="btn details" id="red" (click)="openArchiveForm(e.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="employees.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="viewEmployee">
  <app-view-employee 
  *ngIf="viewEmployee"
  [employee]="viewEmployee"
  (closeForm)="closeViewEmployeeForm()"
  ></app-view-employee>
</div>

<div class="modal-overlay" *ngIf="newEmployee">
  <app-create-employee
  *ngIf="newEmployee"
  [newEmployee]="newEmployee"
  (closeForm)="closeCreateEmployeeForm()"
  ></app-create-employee>
</div>

<!-- Success Alert Modal -->

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
  *ngIf="showArchiveForm"
  [id]="showArchiveForm"
  [message]="'Do you really want to delete this employee?'"
  [alertMessage]="'Employee sucessfully deleted.'"

  (onArchive)="archiveEmployee()"
  (onCancel)="closeArchiveForm()"
  ></app-archive-confirmation>
</div>
