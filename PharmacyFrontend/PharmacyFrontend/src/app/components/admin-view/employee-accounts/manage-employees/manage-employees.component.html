<div class="wrapper">
  <div class="card">
    <!-- Search & Add Employee -->
    <div class="table-header">
      <input type="text" placeholder="🔍 Search employee..." class="search-box" />
      <button class="btn add">+ Add Employee</button>
    </div>

    <!-- Employee Table -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>Employee Code</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role Position</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of employees">
          <td>{{ e.employeeCode }}</td>
          <td>{{ e.fullName }}</td>
          <td>{{ e.email }}</td>
          <td>{{ e.rolePosition }}</td>
          <td>
            <button class="btn details" (click)="openViewEmployeeForm(e)">See Details</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="viewEmployee">
  <app-view-employee 
  *ngIf="viewEmployee"
  [employee]="viewEmployee"
  (closeForm)="closeViewEmployeeForm()"
  ></app-view-employee>
</div>
