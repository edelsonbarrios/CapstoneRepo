<div class="wrapper">
  <div class="card">
    <!-- Search & Add Employee -->
    <div class="table-header">
      <div class="search-wrapper">
        <input type="text" placeholder="🔍 Search Employee" class="search-box"/>
        <button class="btn search-btn">Search</button>
      </div>
    </div>

    <!-- Employee Table -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>Employee Changed</th>
          <th>Action Performed</th>
          <th>Performed By</th>
          <th>Time Stamp</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let eh of paginatedEmployeeHistories">
          <td>{{eh.employeeChanged}}</td>
          <td>{{eh.actionPerformed}}</td>
          <td>{{eh.performedBy}}</td>
          <td>{{eh.performedAt | date: 'medium'}}</td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>
