<div class="modal" *ngIf="newAccount">
  <div class="modal-header">
    <h2>👤 Add Employee</h2>
    <p>Quickly add employee by filling the form</p>
    <button class="upload-btn">Upload Photo</button>
  </div>
  <hr />

  <div class="modal-body">
    <fieldset>
      <legend>📋 Add details of an employee</legend>

      <div class="form-grid">
        <!-- Employee Code -->
        <div class="form-group">
          <label>Account Code <span>*</span></label>
          <input type="text" placeholder="Enter Account Code"/>
        </div>

        <div class="form-group">
          <label>User Name <span>*</span></label>
          <input type="text" placeholder="Enter UserName"/>
        </div>

        <div class="form-group">
          <label>Password<span>*</span></label>
          <input type="text" placeholder="Enter Password"/>
        </div>
      </div>
    </fieldset>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn">Cancel</button>
    <button class="add-btn">+ Add Employee</button>
  </div>
</div>
