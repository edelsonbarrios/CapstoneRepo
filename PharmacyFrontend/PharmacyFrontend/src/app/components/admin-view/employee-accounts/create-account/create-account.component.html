<div class="modal" *ngIf="employeeId">
  <div class="modal-header">
    <h2>👤 Add Employee</h2>
    <p>Quickly add employee by filling the form</p>
    <button class="upload-btn">Upload Photo</button>
  </div>
  <hr />

  <div class="modal-body">
    <fieldset>
      <legend>📋 Add details of an employee</legend>

      <div class="form-grid">

        <div class="form-group">
          <label>User Name <span>*</span></label>
          <input type="text" placeholder="Enter UserName" [(ngModel)]="newAccount.username">
        </div>

        <div class="form-group">
          <label>Password<span>*</span></label>
          <input type="text" placeholder="Enter Password" [(ngModel)]="newAccount.password">
        </div>
      </div>
    </fieldset>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn" (click)="closeCreateAccountForm()">Cancel</button>
    <button class="add-btn" (click)="createNewAccount()">Submit</button>
  </div>
</div>
