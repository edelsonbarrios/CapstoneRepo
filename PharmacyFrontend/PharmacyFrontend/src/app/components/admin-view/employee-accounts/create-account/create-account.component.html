<div class="modal" *ngIf="employeeId && !showSuccessAlert">
  <div class="modal-header">
    <h2>👤 Add Employee Account</h2>
    <p>Quickly add employee by filling the form</p>
    <button class="upload-btn">Upload Photo</button>
  </div>
  <hr />

  <div class="modal-body">
    <fieldset>
      <legend>📋 Add details of an employee</legend>

      <div class="form-grid">

        <div class="form-group" [class.error]="usernameError">
          <label>User Name <span>*</span></label>
          <input type="text" placeholder="Enter UserName" [(ngModel)]="newAccount.username">
          <p class="error-message" *ngIf="usernameError">{{ usernameError }}</p>
        </div>

        <div class="form-group" [class.error]="passwordError">
          <label>Password<span>*</span></label>
          <input type="password" placeholder="Enter Password" [(ngModel)]="newAccount.password">
          <p class="error-message" *ngIf="passwordError">{{ passwordError }}</p>
        </div>
      </div>
    </fieldset>
  </div>

  <div class="modal-footer">
    <button class="add-btn" (click)="createNewAccount()">Submit</button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="success-alert" *ngIf="showSuccessAlert">
  <div class="alert-icon">✓</div>
  <p class="alert-message">Account has been successfully created</p>
  <div class="alert-footer">
    <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
  </div>
</div>
