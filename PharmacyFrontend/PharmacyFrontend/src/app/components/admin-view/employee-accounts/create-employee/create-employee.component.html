<div class="modal">
  <div class="modal-header">
    <h2>👤 Add Employee</h2>
    <p>Quickly add employee by filling the form</p>
    <button class="upload-btn">Upload Photo</button>
  </div>
  <hr />

  <div class="modal-body">
    <fieldset>
      <legend>📋 Add details of an employee</legend>

      <div class="form-grid">
        <div class="form-group">
          <label>Employee Full Name <span>*</span></label>
          <input type="text" placeholder="Enter full name" />
        </div>

        <div class="form-group">
          <label>Employee ID <span>*</span></label>
          <input type="text" placeholder="Enter ID" />
        </div>

        <div class="form-group">
          <label>Email Address <span>*</span></label>
          <input type="email" placeholder="Enter email" />
        </div>

        <div class="form-group">
          <label>Phone No. <span>*</span></label>
          <input type="text" placeholder="Enter phone number" />
        </div>

        <div class="form-group small">
          <label>Age</label>
          <input type="number" placeholder="Age" />
        </div>

        <div class="form-group small">
          <label>Birth Date</label>
          <input type="date" />
        </div>

        <div class="form-group small">
          <label>Gender</label>
          <input type="text" placeholder="Gender" />
        </div>

        <div class="form-group wide">
          <label>Address</label>
          <input type="text" placeholder="Enter address" />
        </div>

        <div class="form-group wide">
          <label>Role Position <span>*</span></label>
          <input type="text" placeholder="Enter role position" />
        </div>
      </div>
    </fieldset>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn" (click)="closeCreateEmployeeForm()">Cancel</button>
    <button class="add-btn">+ Add Employee</button>
  </div>
</div>
