<div class="wrapper">
  <div class="card">
    <!-- Search & Add Employee -->
    <div class="table-header">
      <div class="search-wrapper">
        <input type="text" placeholder="🔍 Search Username" class="search-box" [(ngModel)]="searchUsername">
        <button class="btn search-btn" (click)="searchAccountByUsername()">Search</button>
      </div>
    </div>

    <!-- Employee Table -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>Employee Id</th>
          <th>Username</th>
          <th>Password</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of accounts">
          <td>{{a.employeeId}}</td>
          <td>{{a.username}}</td>
          <td>{{a.password}}</td>
          <td>
            <button class="btn details">See Details</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
