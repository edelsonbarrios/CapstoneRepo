<div class="wrapper">
  <div class="card">
    <!-- Search & Add Employee -->
    <div class="table-header">
      <div class="search-wrapper">
        <input type="text" 
        placeholder="🔍 Search Username" class="search-box" 
        [(ngModel)]="searchUsername"
        (input)="onSearchChange()"
        >
        <button class="btn search-btn" (click)="searchAccountByUsername()">Search</button>
      </div>
    </div>

    <!-- Employee Table -->
    <table class="modern-table">
      <thead>
        <tr>
          <th>Employee Id</th>
          <th>Username</th>
          <th>Password</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of paginatedAccounts">
          <td>{{a.employeeId}}</td>
          <td>{{a.username}}</td>
          <td>{{a.password}}</td>
          <td>
            <button class="btn details" (click)="resetPassword(a.id)">Reset Password</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</div>

<div class="success-overlay" *ngIf="showSuccessMessage">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">{{showSuccessMessage}}</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeResetPasswordMessage()">OK</button>
    </div>
  </div>
</div>
