<div class="wrapper">
  <header>
    <img src="/images/view-employee-images/see-details.png" alt="See Details Image">
    <h1>See Details</h1>
  </header>
  <hr>
  <div class="display-wrapper">
    <img src="/images/view-employee-images/nigga-man.png" alt="User Profile Image">
    <h1>Name</h1>
    <h2>Role Position</h2>
  </div>
  <main>
    <div class="employee-property">
      <img src="/images/view-employee-images/employee-code.png" alt="Employee Code">
      <h1>Employee Code: </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
    <div class="employee-property">
      <img src="/images/view-employee-images/email.png" alt="Employee Code">
      <h1>Email : </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
    <div class="employee-property">
      <img src="/images/view-employee-images/phone.png" alt="Employee Code">
      <h1>Contact Number : </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
    <div class="employee-property">
      <img src="/images/view-employee-images/cake.png" alt="Employee Code">
      <h1>Birth Date : </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
    <div class="employee-property">
      <img src="/images/view-employee-images/mother-child.png" alt="Employee Code">
      <h1>Age: </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
    <div class="employee-property">
      <img src="/images/view-employee-images/gender.png" alt="Employee Code">
      <h1>Gender : </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
    <div class="employee-property">
      <img src="/images/view-employee-images/address.png" alt="Employee Code">
      <h1>Address : </h1>
      <input type="text" placeholder="EmployeeCode" [(ngModel)]="employee.employeeCode">
    </div>
  </main>
</div>
