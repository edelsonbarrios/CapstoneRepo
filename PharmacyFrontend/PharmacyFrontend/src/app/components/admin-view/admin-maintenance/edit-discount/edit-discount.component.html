<div class="modal">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fas fa-tags"></i>
      </div>
      <div class="title">
        <h2>Edit Discount</h2>
        <p>Modify the discount details</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <fieldset>
      <legend>
        <i class="fas fa-clipboard-list"></i>
        Discount Details
      </legend>

      <div class="form-grid">
        <!-- Discount Name -->
        <div class="form-group">
          <label for="discountName">
            Name
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="discountName"
            placeholder="Enter Discount Name"
            [(ngModel)]="editDiscount.discountName"
          />
        </div>

        <!-- Status -->
        <div class="form-group">
          <label for="status">
            Amount
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="discountName"
            placeholder="Enter Discount Amount"
            [(ngModel)]="editDiscount.discountAmount"
          >
        </div>

        <div class="form-group">
          <label for="status">
            Start Date
            <span class="required">*</span>
          </label>
          <input
            type="date"
            id="discountName"
            [(ngModel)]="editDiscount.startDate"
          >
        </div>

        <div class="form-group">
          <label for="status">
            End Date
            <span class="required">*</span>
          </label>
          <input
            type="date"
            id="discountName"
            [(ngModel)]="editDiscount.endDate"
          >
        </div>

      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeEditDiscountForm()">
      Cancel
    </button>
    <button class="btn btn-save" (click)="updateDiscount()">
      <i class="fas fa-save"></i>
      Save Changes
    </button>
  </div>
</div>

<div class="error-overlay" *ngIf="discountNameError">
  <div class="error-alert">
    <div class="alert-icon">X</div>
    <p class="alert-message">{{discountNameError}}.</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon success">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#10b981" opacity="0.1"/>
        <circle cx="24" cy="24" r="18" fill="#10b981"/>
        <path d="M16 24L21 29L32 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 class="alert-title">Success!</h3>
    <p class="alert-message">Discount successfully updated.</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">Got it</button>
    </div>
  </div>
</div>
