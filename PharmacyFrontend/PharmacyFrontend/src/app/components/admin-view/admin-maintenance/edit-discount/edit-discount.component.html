<div class="modal">

  <!--  DISCOUNT HEADER -->
  <div class="modal-header">
    <h2>Edit VAT Rates</h2>
    <a (click)="closeEditDiscountForm()">X</a>
  </div>

  <!-- EDIT DISCOUNT -->
  <div class="fillup">
    <label>Name</label>
    <input type="text" [(ngModel)]="editDiscount.discountName" >
    
    <label>Value</label>
    <input type="number" [(ngModel)]="editDiscount.discountRate">

    <p>Status</p>
    <select id="status">
      <option>Active</option>
    </select>

    <!-- FOOTER -->
     <div class="footer">
      <button class="btn-save"(click)="updateDiscount()">Save Changes</button>
     </div>

     <!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">Discount has been saved Successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>
