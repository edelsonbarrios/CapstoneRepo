<div class="modal">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fas fa-tags"></i>
      </div>
      <div class="title">
        <h2>Edit Discount</h2>
        <p>Modify the discount details</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <fieldset>
      <legend>
        <i class="fas fa-clipboard-list"></i>
        Discount Details
      </legend>

      <div class="form-grid">
        <!-- Discount Name -->
        <div class="form-group">
          <label for="discountName">
            Name
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="discountName"
            placeholder="Enter Discount Name"
            [(ngModel)]="editDiscount.discountName"
          />
        </div>

        <!-- Status -->
        <div class="form-group">
          <label for="status">
            Rates
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="discountName"
            placeholder="Enter Discount Rate"
            [(ngModel)]="editDiscount.discountRate"
          >
        </div>
      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeEditDiscountForm()">
      Cancel
    </button>
    <button class="btn btn-save" (click)="updateDiscount()">
      <i class="fas fa-save"></i>
      Save Changes
    </button>
  </div>
</div>
