<div class="modal">
  
  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fas fa-tags"></i>
      </div>
      <div class="title">
        <h2>Edit Discount</h2>
        <p>Modify the discount details</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <fieldset>
      <legend>
        <i class="fas fa-clipboard-list"></i>
        Discount Details
      </legend>

      <div class="form-grid">
        <!-- Discount Name -->
        <div class="form-group">
          <label for="discountName">
            Name
            <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="discountName"
            placeholder="Enter Discount Name"
          />
        </div>

        <!-- Discount Type -->
        <div class="form-group">
          <label for="discountType">
            Type
            <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="discountType"
            placeholder="Enter Discount Type"
          />
        </div>

        <!-- Discount Value -->
        <div class="form-group">
          <label for="discountValue">
            Value
            <span class="required">*</span>
          </label>
          <input 
            type="number" 
            id="discountValue"
            placeholder="Enter Discount Value"
          />
        </div>

        <!-- Discount Validity -->
        <div class="form-group">
          <label for="discountValidity">
            Validity
            <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="discountValidity"
            placeholder="Enter Validity Period"
          />
        </div>

        <!-- Status -->
        <div class="form-group">
          <label for="status">
            Status
            <span class="required">*</span>
          </label>
          <select id="status">
            <option>Active</option>
          </select>
        </div>
      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel">
      Cancel
    </button>
    <button class="btn btn-save">
      <i class="fas fa-save"></i>
      Save Changes
    </button>
  </div>
</div>
