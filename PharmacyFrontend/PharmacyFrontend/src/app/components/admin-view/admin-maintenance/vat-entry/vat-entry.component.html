<main class="wrapper">
  <div class="manage-vat-rates">
    <h1>Manage Vat Rates</h1>

    <!-- VAT CONTROLS -->
    <div class="vat-control" [class.error]="vatError">
      <input type="text" id="vat-name" name="vat-name" placeholder="VAT Name" [(ngModel)]="createdVat.vatName">
      <input type="text" id="rate" name="rate" placeholder="Rate (%)" [(ngModel)]="createdVat.vatRate">
      <input type="date" id="vdate" name="vdate" [(ngModel)]="createdVat.dateCreated">
    </div>
    <p class="error-message" *ngIf="vatError">{{ vatError }}</p>
    <button class="btn-save" (click)="createNewVat()">Save VAT</button>

    <!-- VAT TABLES -->
    <table class="vat-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Rate</th>
          <th>Effective Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="vats.length === 0">
          <td colspan="4" style="text-align: center; color: #888; padding: 1rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let v of paginatedVats">
          <td>{{v.vatName}}</td>
          <td>{{v.vatRate}}%</td>
          <td>{{v.dateCreated | date: 'dd-MM-yyyy'}}</td>
          <td>
            <button class="btn-edit" (click)="openEditVatForm()">Edit</button>
            <button class="btn-archive" (click)="archiveVat(v)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="vats.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</main>

<div class="modal-overlay" *ngIf="editVat">
  <app-edit-vat *ngIf="editVat"></app-edit-vat>
</div>

<!-- Success Alert Modal for Save -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">{{successMessage}}</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>
