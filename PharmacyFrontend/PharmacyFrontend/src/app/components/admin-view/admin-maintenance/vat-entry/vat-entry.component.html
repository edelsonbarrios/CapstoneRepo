<main class="wrapper">
  <div class="manage-vat-rates">
    <h1>Manage Vat Rates</h1>

    <!-- VAT CONTROLS -->
    <div class="vat-control">
      <input type="text" id="vat-name" name="vat-name" placeholder="VAT Name">
      <input type="text" id="rate" name="rate" placeholder="Rate (%)">
      <input type="date" id="vdate" name="vdate">
    </div>
    <button>SAVE Vat</button>

    <!-- VAT TABLES -->
    <table class="vat-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Rate</th>
          <th>Effective Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Standard VAT</td>
          <td>Reduced VAT</td>
          <td>Pharmaceutical VAT</td>
          <td>Medicines VAT</td>
          <td>Zero</td>
        </tr>
        <tr>
          
        </tr>
        <tr>
          
        </tr>
        <tr>
          
        </tr>
        <tr>
          
        </tr>
      </tbody>
    </table>
  </div>
</main>
