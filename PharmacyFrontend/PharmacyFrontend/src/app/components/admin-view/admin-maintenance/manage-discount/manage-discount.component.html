<main class="wrapper">
  <div class="manage-vat-rates">
    <h1>Manage Discount</h1>

    <!-- DISCOUNT CONTROLS -->
    <div class="vat-control" [class.error]="errorMessage">
      <input type="text" id="discount-name" name="discount-name" placeholder="Discount Name"
        [(ngModel)]="newDiscount.discountName">
      <input type="text" id="value" name="value" placeholder="Value" [(ngModel)]="newDiscount.discountRate">
    </div>
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    <button class="btn-save" (click)="createNewDiscount()">Save Discount</button>

    <!-- VAT TABLES -->
    <table class="vat-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Value</th>
          <th>Validity</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="discounts.length === 0">
          <td colspan="5" style="text-align: center; color: #888; padding: 1rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let d of paginatedDiscounts">
          <td>{{d.discountName}}</td>
          <td>Percentage</td>
          <td>{{d.discountRate}}%</td>
          <td>Active</td>
          <td>
            <button class="btn-edit" (click)="openEditDiscountForm()">Edit</button>
            <button class="btn-archive" (click)="openArchiveForm(d.id)">Archive</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="discounts.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</main>

<div class="modal-overlay" *ngIf="editDiscount">
  <app-edit-discount *ngIf="editDiscount"></app-edit-discount>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">{{successMessage}}</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">OK</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showArchiveForm">
  <app-archive-confirmation
  *ngIf="showArchiveForm"
  [id]="showArchiveForm"
  [alertMessage]="'Discount successfully deleted.'"
  [message]="'Do you really want to delete this discount?'"

  (onArchive)="archiveDiscount()"
  (onCancel)="closeArchiveForm()"
  ></app-archive-confirmation>
</div>

<div class="modal-overlay" *ngIf="showErrorMessage">
  <div class="success-alert">
    <div class="alert-icon">✓</div>
    <p class="alert-message">{{showErrorMessage}}</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeValidationMessage()">OK</button>
    </div>
  </div>
</div>
