<div class="modal">

  <!-- VAT RATES HEADER -->
  <div class="modal-header">
    <h2>Edit VAT Rates</h2>
    <a (click)="closeEditVatForm()">X</a>
  </div>

  <!-- EDIT VAT RATES -->
  <div class="fillup">
    <label>Name</label>
    <input type="text" [(ngModel)]="editVat.vatName">

    <label>Rates</label>
    <input type="number" [(ngModel)]="editVat.vatRate">
  </div>

    <!-- FOOTER -->
     <div class="footer">
      <button class="btn-save" (click)="editVAT()">Save Changes</button>
     </div>
</div>
