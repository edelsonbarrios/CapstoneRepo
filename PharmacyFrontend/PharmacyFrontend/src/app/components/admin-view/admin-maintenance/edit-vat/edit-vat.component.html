<div class="modal" *ngIf="!showSuccessAlert">

  <!-- MODAL HEADER -->
  <div class="modal-header">
    <div class="icon-title">
      <div class="icon-wrapper">
        <i class="fas fa-percentage"></i>
      </div>
      <div class="title">
        <h2>Edit VAT Rates</h2>
        <p>Modify the VAT rate details</p>
      </div>
    </div>
  </div>

  <!-- MODAL BODY -->
  <div class="modal-body">
    <fieldset>
      <legend>
        <i class="fas fa-clipboard-list"></i>
        VAT Details
      </legend>

      <div class="form-grid">
        <!-- VAT Name -->
        <div class="form-group">
          <label for="vatName">
            Name
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="vatName"
            placeholder="Enter VAT Name"
            [(ngModel)]="editVat.vatName"
          />
        </div>

        <!-- VAT Rate -->
        <div class="form-group">
          <label for="vatRate">
            Rates
            <span class="required">*</span>
          </label>
          <input
            type="number"
            id="vatRate"
            placeholder="Enter VAT Rate"
            [(ngModel)]="editVat.vatRate"
          />
        </div>
      </div>
    </fieldset>
  </div>

  <!-- MODAL FOOTER -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeEditVatForm()">
      Cancel
    </button>
    <button class="btn btn-save" (click)="editVAT()">
      <i class="fas fa-save"></i>
      Save Changes
    </button>
  </div>
</div>

<!-- Success Alert Modal -->
<div class="modal-overlay" *ngIf="showSuccessAlert">
  <div class="success-alert">
    <div class="alert-icon success">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#10b981" opacity="0.1"/>
        <circle cx="24" cy="24" r="18" fill="#10b981"/>
        <path d="M16 24L21 29L32 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 class="alert-title">Success!</h3>
    <p class="alert-message">VAT has been saved successfully</p>
    <div class="alert-footer">
      <button class="ok-btn" (click)="closeSuccessAlert()">Got it</button>
    </div>
  </div>
</div>
