<div class="wrapper">
  <!-- PROFILE SECTION -->
  <div class="profile">
    <div class="logo">
      <div class="logo-container">
        <img src="logo.png" alt="logo" />
      </div>
    </div>
    <div class="user-info">
      <div class="avatar">
        <span>{{ getInitials(employee.fullName) }}</span>
      </div>
      <div class="details">
        <div class="name">{{ employee.fullName }}</div>
        <div class="role">{{ employee.rolePosition }}</div>
      </div>
    </div>
  </div>

  <!-- MAIN NAVIGATION -->
  <nav class="nav">
    <a routerLink="/admin-main/admin-dashboard" routerLinkActive="active" class="nav-item">
      <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
      <span class="label">Dashboard</span>
    </a>
    <a routerLink="/admin-main/admin-reports-main" routerLinkActive="active" class="nav-item">
      <span class="icon"><i class="fa-solid fa-flag"></i></span>
      <span class="label">Reports</span>
    </a>
    <a routerLink="/admin-main/admin-maintenance-main" routerLinkActive="active" class="nav-item">
      <span class="icon"><i class="fa-solid fa-toolbox"></i></span>
      <span class="label">Maintenance</span>
    </a>
    <a routerLink="/admin-main/admin-supplier" routerLinkActive="active" class="nav-item">
      <span class="icon"><i class="fa-solid fa-truck-field"></i></span>
      <span class="label">Supplier</span>
    </a>

    <a routerLink="/admin-main/employee-accounts-main" routerLinkActive="active" class="nav-item">
      <span class="icon"><i class="fa-solid fa-users"></i></span>
      <span class="label">Employee Accounts</span>
    </a>
    <a routerLink="/admin-main/your-account" routerLinkActive="active" class="nav-item">
      <span class="icon"><i class="fa-solid fa-gear"></i></span>
      <span class="label">Your Account</span>
    </a>

    <!-- INVENTORY DROPDOWN -->
    <div class="nav-item-dropdown" [class.active]="isInventoryRouteActive()">
      <div class="nav-item" (click)="toggleInventoryDropdown()" [class.active]="isInventoryRouteActive()">
        <span class="icon"><i class="fa-solid fa-boxes-stacked"></i></span>
        <span class="label">Inventory</span>
        <span class="dropdown-arrow" [class.open]="isInventoryDropdownOpen">
          <i class="fa-solid fa-chevron-down"></i>
        </span>
      </div>
      <div class="dropdown-menu" [class.show]="isInventoryDropdownOpen">
        <a routerLink="/admin-main/admin-product-main/admin-manage-products" routerLinkActive="active" class="dropdown-item">
          <span class="label">Product Module</span>
        </a>
        <a routerLink="/admin-main/admin-inventory-module-main" routerLinkActive="active" class="dropdown-item">
          <span class="label">Inventory Module</span>
        </a>
        <a routerLink="/admin-main/admin-inventory-purchase-order" routerLinkActive="active" class="dropdown-item">
          <span class="label">Purchase Order Module</span>
        </a>
        <a routerLink="/admin-main/admin-manage-replenishment" routerLinkActive="active" class="dropdown-item">
          <span class="label">Replenishment Module</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <button class="logout-btn" (click)="logOut()">
      <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
      <span class="label">Logout</span>
    </button>
  </div>
</div>
