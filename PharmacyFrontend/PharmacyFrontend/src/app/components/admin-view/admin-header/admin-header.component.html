<div class="wrapper">
  <!-- PROFILE SECTION -->
  <div class="profile">
    <div class="logo">
      <div class="logo-container">
        <img src="logo.png" alt="logo" />
      </div>
    </div>
    <div class="user-info">
      <div>
        <div class="name">{{ employee.fullName }}</div>
        <div class="email">{{ employee.rolePosition }}</div>
      </div>
    </div>
  </div>

  <!-- MAIN NAVIGATION -->
  <nav class="nav">
    <a routerLink="/admin-main/admin-dashboard" routerLinkActive="active">📊 Dashboard</a>
    <a routerLink="/admin-main/admin-reports-main" routerLinkActive="active">📈 Reports</a>
    <a routerLink="/admin-main/admin-maintenance-main" routerLinkActive="active">🛠️ Maintenance</a>
    <a routerLink="/admin-main/admin-supplier" routerLinkActive="active">📦 Supplier</a>
    <a routerLink="/admin-main/employee-accounts-main" routerLinkActive="active">👤 Employee Accounts</a>
  </nav>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <a (click)="logOut()">↩️ Logout</a>
  </div>
</div>
