<main class="wrapper">
    <div class="header">
      <h1>Dashboard Overview</h1>
      <input class="searchbar" id="search" type="text" placeholder="Search..">
      <div class="notification">🔔<span class="dot"></span></div>
    </div>
    <div class="containers">
      <div class="grid-items sales-status">
        <div class="content sales">
          <p class="title sales-title">Today's Sales</p>
          <a class="interact view-report" routerLink="/admin-main/admin-reports-main">View Report &gt;</a>
        </div>
      </div>

      <div class="grid-items inventory">
        <div class="content inv-status">
          <p class="title inventory-title">Inventory Status</p>
          <a class="interact reorder">Reorder &gt;</a>
        </div>
      </div>

      <div class="grid-items top-selling-meds">
        <div class="content top-meds">
          <p class="title inventory-title">Top Selling Medicines (This month)</p>
          <a class="interact view-report">See more &gt;</a>
        </div>
      </div>

      <div class="grid-items sales-trends">
        <div class="content trend-sales">
          <p class="title trend-title">Sales and Inventory trends</p>
        </div>
      </div>

      <div class="grid-items expiry">
        <div class="content expiring-soon">
          <p class="title expiry-title">Expiring Soon</p>
        </div>
      </div>
    </div>
</main>
