<main class="wrapper">
    <div class="header">
      <h1>Dashboard Overview</h1>
      <input class="searchbar" id="search" type="text" placeholder="Search..">
      <div class="notification">🔔<span class="dot"></span></div>
    </div>
    <div class="top-containers">
      <div class="sales-status">
        <div class="sales">
          <p class="text-sales">Today's Sales</p>
          <a class="view-report">View Report &gt;</a>
        </div>
      </div>
      <div class="inventory">
        <div class="inv-status">
          <p class="status-inventory">Inventory Status</p>
          <a class="reorder">Reorder &gt;</a>
        </div>
      </div>
      <div class="top-selling-meds">
        <div class="top-meds">
          <p class="meds-calendar">Top Selling Medicines</p>
          <p class="meds-calendar">(This Month)</p>
        </div>
      </div>
    </div>
    <div class="bottom-containers">
      <div class="sales-trends">
          <p class="text-trend">Sales and Inventory trends</p>
      </div>
      <div class="expiry">
        <div class="expiring-soon">
          
        </div>
      </div>
    </div>
</main>
