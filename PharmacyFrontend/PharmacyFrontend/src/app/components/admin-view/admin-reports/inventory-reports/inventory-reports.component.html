<main class="container">

  <!-- INVENTORY SUMMARY CONTAINER -->
  <div class="grid-items inventory-summary">
    <div class="header">
      <h1>Inventory Summary of <span>(Month)</span></h1>
    </div>
    <div class="title-date">
      <div class="label">Starting Date</div>
      <div class="label">Starting Date</div>
      <div class="label">Starting Date</div>
    </div>
    <div class="date-control">
      <input type="date" id="start-input" name="start-input">
      <input type="date" id="end-input" name="end-input">
      <select>
        <option value="all">All</option>
        <option value="good">Good</option>
        <option value="fair">Fair</option>
        <option value="poor">Poor</option>
      </select>
    </div>
  </div>
  <div class="grid-items total-sales"></div>
  <div class="grid-items inventory-details"></div>
</main>
