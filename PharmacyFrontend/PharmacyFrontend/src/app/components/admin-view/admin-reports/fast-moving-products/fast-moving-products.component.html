<main class="wrapper">

  <div class="upper-container">
    <div class="sub-container">
      <div class="content">
        <label>Produc Sold</label>
        <p>89</p>
      </div>
    </div>

    <div class="sub-container">
      <div class="content">
        <label>Total Quantity</label>
        <p>150</p>
      </div>
    </div>

    <div class="sub-container">
      <div class="content">
        <label>Total Revenue</label>
        <p>&#8369;125,000.00</p>
      </div>
    </div>
  </div>

  <div class="middle container">
    <h2>Fast-Moving Product Report</h2>

    <div class="cntr-control">
      <div class="control">
        <label>Start Date</label>
        <input type="date" />
      </div>
    
      <div class="control">
        <label>End Date</label>
        <input type="date" />
      </div>
    
      <div class="control">
        <label>Top N Products</label>
        <select id="top">
          <option value="">Top Products</option>
          <option value="top-10">Top 10</option>
          <option value="top-20">Top 20</option>
          <option value="top-50">Top 50</option>
          <option value="top-100">Top 1000</option>
        </select>
      </div>
    </div>

    <button>Export Excel</button>
  </div>

  <div class="lower container">
    <h2>Product Ranking</h2>

    <table class="ranking-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Product</th>
          <th>Category</th>
          <th>Qty Sold</th>
          <th>Revenue</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="products.length === 0">
          <td colspan="6" style="text-align: center; color: #525252; padding: 1rem;">
            No recent data
          </td>
        </tr>
        <tr *ngFor="let p of paginatedProducts">
          <td>{{p.rank}}</td>
          <td>{{p.product}}</td>
          <td>{{p.category}}</td>
          <td>{{p.qtySold}}</td>
          <td>{{p.revenue}}</td>
          <td><span>{{p.stock}}</span></td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION CONTROLS -->
    <div class="pagination-controls" *ngIf="products.length > 0">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Previous</button>
      <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
    </div>
  </div>
</main>
