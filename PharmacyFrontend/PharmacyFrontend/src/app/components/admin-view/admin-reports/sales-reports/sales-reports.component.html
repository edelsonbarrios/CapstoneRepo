        <h1>Total Sales</h1>

      </div>

    <div class="child-wrapper">

        <div class="top-selling-medicine">

        </div>
        <div class="top-selling-medicine">

          <p>200 sold</p>
        </div>

          <p>Cetirizine 10mg</p>

        </div>
      </div>
    </div>
    </div>

  </div>

    SALES TREND
  </div>

  <div class="transaction-trend-wrapper">

  <div class="transactions-wrapper">

</div>
