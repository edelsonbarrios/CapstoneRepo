<div class="wrapper">

  <div class="total-sales-wrapper">

    <div class="header-wrapper">
      <h1>Total Sales</h1>
      <select name="" [(ngModel)]="selectedMonth">
        <option value="">Monthly</option>
        <option *ngFor="let m of months" [value]="m">{{m}}</option>
      </select>
    </div>

    <div class="main-wrapper">

      <div class="header-wrapper">
        <h1>₱24,000</h1>
        <h2>Number of Transactions</h2>
        <h3>420</h3>
        <p><span>+8%</span> prev. month</p>
      </div>

      <div class="top-selling-wrapper">

        <div class="top-selling-header">
          <h1 id="top-selling-header">Top Selling Medicines (This Month)</h1>
        </div>

        <div class="medicines-wrapper">
          <div class="top-selling-medicine">
            <p>Biogesic</p>
            <p>320 sold</p>
          </div>
          <div class="top-selling-medicine">
            <p>Cecon 500mg</p>
            <p>280 sold</p>
          </div>
          <div class="top-selling-medicine">
            <p>Bioflu 500mg</p>
            <p>250 sold</p>
          </div>
          <div class="top-selling-medicine">
            <p>Amoxicillin 500mg</p>
            <p>200 sold</p>
          </div>
          <div class="top-selling-medicine">
            <p>Cetirizine 10mg</p>
            <p>180 sold</p>
          </div>
        </div>

      </div>

    </div>

  </div>

  <div class="sales-trend-wrapper">
    SALES TREND
  </div>

  <div class="transaction-trend-wrapper">
    <h1>SALES TREND</h1>
    <h2>ASKDJHQWKEJWQHE</h2>
  </div>

  <div class="transactions-wrapper">
    <div class="header-wrapper">
      <div class="element">TRASNACTION</div>
      <div class="element">ASLDJHQWE</div>
    </div>
  </div>

</div>
